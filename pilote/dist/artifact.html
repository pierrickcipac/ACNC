          { q: 'Quelle est l’orthographe officielle OACI de la lettre A ?', choices: ['Alpha', 'Alfa', 'Alpa', 'Alfha'], a: 1, exp: 'L’OACI écrit « Alfa » avec un f.', how: 'L’orthographe a été choisie pour que les locuteurs non anglophones, notamment francophones et hispanophones, ne prononcent pas le « ph » autrement que « f ».', src: S_ALPHA },
          { q: 'Comment se prononce le chiffre 9 à la radio ?', choices: ['Nine', 'Niner', 'Nein', 'Neuf'], a: 1, exp: 'Le 9 se dit « niner ».', how: 'On évite ainsi la confusion avec « nein » (non, en allemand) et avec « five » quand la radio grésille.', src: S_ALPHA },
          { q: 'Comment annonce-t-on le QNH 1013 ?', choices: ['Ten thirteen', 'One zero one three', 'One thousand thirteen', 'Thirteen'], a: 1, exp: 'Les valeurs de QNH se disent chiffre par chiffre : one zero one tree.', how: 'Dire chaque chiffre séparément évite les erreurs : « ten thirteen » pourrait être mal entendu. Le 3 se prononce « tree ».', src: S_ALPHA },
          { q: 'Comment épeler l’immatriculation F-OJTB ?', choices: ['Foxtrot Oscar Juliett Tango Bravo', 'France Oscar Julie Thomas Bernard', 'Fox Oscar Juliet Tango Bravo', 'Foxtrot Orange Juliett Tango Bravo'], a: 0, exp: 'F = Foxtrot, O = Oscar, J = Juliett, T = Tango, B = Bravo.', how: 'Jamais de prénoms ni de mots inventés : uniquement l’alphabet OACI, pour que le contrôleur et les autres pilotes comprennent sans ambiguïté.', fig: 'otan', src: S_ALPHA },
          { q: 'Par quelles lettres commence l’immatriculation d’un avion basé en Nouvelle-Calédonie ?', choices: ['F-G', 'F-O', 'NC-', 'VH-'], a: 1, exp: 'Les aéronefs français d’outre-mer sont immatriculés F-O…', how: 'Chaque pays a un préfixe d’immatriculation attribué par l’OACI : F pour la France (F-G… et F-H… en métropole), VH pour l’Australie, ZK pour la Nouvelle-Zélande.', src: { label: 'OACI, Annexe 7 « Marques de nationalité et d’immatriculation des aéronefs »' } },
          { q: 'Comment annonce-t-on la fréquence 118,1 MHz ?', choices: ['One eighteen point one', 'One one eight decimal one', 'Hundred eighteen one', 'One one eight one'], a: 1, exp: 'Chiffre par chiffre, la virgule se dit « decimal ».', how: 'La virgule est indispensable : sans elle, « one one eight one » pourrait être compris comme une autre fréquence.', src: S_ALPHA },
          { q: 'Comment annonce-t-on une altitude de 2 500 ft ?', choices: ['Two five zero zero feet', 'Two thousand five hundred feet', 'Twenty-five hundred feet', 'Flight level two five'], a: 1, exp: 'Les altitudes rondes utilisent « thousand » et « hundred ».', how: 'Exception à la règle du chiffre par chiffre : les altitudes et hauteurs en milliers et centaines ronds se disent avec thousand et hundred, c’est plus court et plus clair.', src: S_ALPHA }
        ]
      },
      {
        id: 'fdm-2', title: 'Unités, heure UTC et ordres de grandeur', domain: 'nav', duration: 20, verified: false,
        intro: 'En aviation, on ne compte ni en mètres ni en km/h : on compte en pieds, en milles nautiques et en nœuds, et on vit à l’heure UTC.',
        sections: [
          { h: 'Les unités du pilote', html: '<table class="tbl"><thead><tr><th>Grandeur</th><th>Unité</th><th>Équivalence</th></tr></thead><tbody><tr><td>Altitude, hauteur</td><td>pied (ft)</td><td>1 ft = 0,3048 m (≈ 30 cm)</td></tr><tr><td>Distance</td><td>mille nautique (NM)</td><td>1 NM = 1 852 m</td></tr><tr><td>Vitesse</td><td>nœud (kt)</td><td>1 kt = 1 NM/h = 1,852 km/h</td></tr><tr><td>Vitesse verticale</td><td>pied par minute (ft/min)</td><td>500 ft/min ≈ 2,5 m/s</td></tr><tr><td>Pression</td><td>hectopascal (hPa)</td><td>pression standard : 1013,25 hPa</td></tr><tr><td>Visibilité</td><td>mètre ou kilomètre</td><td>9999 dans un METAR = 10 km ou plus</td></tr><tr><td>Masse</td><td>kilogramme (kg)</td><td></td></tr></tbody></table>', tip: 'Calcul mental : des pieds en mètres, divise par 3 et retire 10 %. 3 000 ft ≈ 1 000 − 100 = 900 m (exact : 914 m).', src: S_U },
          { h: 'Pourquoi des milles nautiques ?', html: '<p>Un mille nautique correspond à <strong>une minute d’arc de latitude</strong> sur la Terre. Sur une carte, on peut donc mesurer une distance directement avec l’échelle des latitudes : 1° de latitude = 60 NM.</p><p>Le nœud est simplement un mille nautique par heure. On dit « 120 nœuds », jamais « 120 nœuds par heure ».</p>', src: S_U },
          { h: 'L’heure UTC, ou « Zulu »', html: '<p>Tous les documents aéronautiques (plans de vol, METAR, NOTAM, carnets de route) sont en <strong>temps universel coordonné (UTC)</strong>, noté Z et prononcé « Zulu ». Tout le monde parle ainsi de la même heure, quel que soit le fuseau.</p><p>La Nouvelle-Calédonie est à <strong>UTC + 11</strong> toute l’année (pas d’heure d’été). La France métropolitaine est à UTC + 1 en hiver et UTC + 2 en été.</p>', tip: 'Pour passer de l’heure UTC à l’heure de Nouméa, ajoute 11 h. Un METAR de 2200Z correspond à 9 h du matin le lendemain à Nouméa.', src: { label: 'OACI, Annexe 5, ch. 3 et Annexe 2, ch. 3.5' } },
          { h: 'Le niveau de vol', html: '<p>En montant, à partir d’une certaine altitude (l’altitude de transition), tous les avions règlent leur altimètre sur la même pression standard : <strong>1013,25 hPa</strong>. On parle alors en <strong>niveaux de vol</strong> (FL, <em>flight level</em>) : l’altitude-pression en centaines de pieds. FL 100 = 10 000 ft avec le calage standard.</p>', fig: 'calage', caption: 'Altitude (QNH), hauteur (QFE), niveau de vol (1013).', src: { label: 'OACI, Doc 8168 (PANS-OPS), Vol. I, partie III, section 1' } }
        ],
        keypoints: ['Hauteurs en pieds, distances en milles nautiques, vitesses en nœuds.', '1 ft ≈ 0,3 m ; 1 NM = 1 852 m ; 1 kt = 1,852 km/h.', 'Tout est en UTC (Zulu). Nouméa = UTC + 11.', 'Niveau de vol = altitude-pression en centaines de pieds au calage 1013.'],
        sources: [S_U],
        quiz: [
          { q: 'Combien mesure exactement un mille nautique ?', choices: ['1 000 m', '1 609 m', '1 852 m', '2 000 m'], a: 2, exp: '1 NM = 1 852 m exactement.', how: 'Le mille nautique vient de la minute d’arc de latitude, ce qui le rend pratique sur les cartes. 1 609 m est le mille terrestre, qui n’est pas utilisé en aviation.', src: S_U },
          { q: 'Que vaut 1 pied (ft) ?', choices: ['0,3048 m', '1 m', '0,5 m', '3,28 m'], a: 0, exp: '1 ft = 0,3048 m, soit environ 30 cm.', how: 'Inversement, 1 m ≈ 3,28 ft. Calcul rapide : 1 000 ft ≈ 300 m.', src: S_U },
          { q: 'Un avion vole à 100 kt. Quelle est sa vitesse en km/h ?', choices: ['100 km/h', '160 km/h', '185 km/h', '200 km/h'], a: 2, exp: '100 × 1,852 ≈ 185 km/h.', how: 'Un nœud est un mille nautique par heure, et un mille nautique vaut 1,852 km.', src: S_U },
          { q: 'Dans quelle unité donne-t-on l’altitude en aviation civile ?', choices: ['En mètres', 'En pieds', 'En milles', 'En hectopascals'], a: 1, exp: 'Les altitudes et hauteurs sont données en pieds.', how: 'C’est la norme OACI dans la quasi-totalité du monde. Quelques pays utilisent encore le mètre (par exemple pour certains niveaux de vol), ce que les pilotes de ligne doivent connaître.', src: S_U },
          { q: 'Que signifie la lettre Z dans « 1430Z » ?', choices: ['Zone', 'UTC (Zulu)', 'Heure locale', 'Heure d’été'], a: 1, exp: 'Z = Zulu = UTC.', how: 'L’UTC est l’heure de référence mondiale. En l’utilisant partout, un pilote à Nouméa et un contrôleur à Sydney parlent de la même heure.', src: { label: 'OACI, Annexe 5 et Annexe 2' } },
          { q: 'Il est 23:00 UTC. Quelle heure est-il à Nouméa ?', choices: ['10:00 le lendemain', '12:00 le même jour', '22:00', '04:00 le lendemain'], a: 0, exp: '23 + 11 = 34, soit 10:00 le lendemain.', how: 'La Nouvelle-Calédonie est à UTC + 11 toute l’année. Au-delà de 24 h, on passe au jour suivant.', src: S_U },
          { q: 'Un vol part de Nouméa à 08:00 heure locale. Quelle heure UTC figure sur le plan de vol ?', choices: ['08:00Z', '19:00Z la veille', '21:00Z la veille', '11:00Z'], a: 2, exp: '08:00 − 11 h = 21:00 UTC la veille.', how: 'Pour passer de l’heure de Nouméa à l’UTC, on retire 11 h. Si on passe sous 0 h, on recule d’un jour.', src: S_U },
          { q: 'À quoi correspond le niveau de vol FL 085 ?', choices: ['850 ft', '8 500 ft d’altitude-pression', '85 m', '8 500 m'], a: 1, exp: 'FL 085 = 8 500 ft avec le calage standard 1013,25 hPa.', how: 'Le niveau de vol est une altitude-pression exprimée en centaines de pieds. Tous les avions utilisant le même calage, ils restent séparés entre eux même si la pression réelle varie.', fig: 'calage', src: { label: 'OACI, Doc 8168 (PANS-OPS), Vol. I' } },
          { q: 'Quelle est la pression standard au niveau de la mer ?', choices: ['1000 hPa', '1013,25 hPa', '1030 hPa', '760 hPa'], a: 1, exp: '1013,25 hPa, soit 29,92 pouces de mercure.', how: 'C’est la valeur de l’atmosphère standard OACI, une atmosphère « moyenne » de référence utilisée pour étalonner les instruments.', fig: 'atmosphere', src: { label: 'OACI, Doc 7488 « Manuel de l’atmosphère type OACI »' } },
          { q: 'Un variomètre indique 500 ft/min en montée. Combien de pieds gagne l’avion en 3 minutes ?', choices: ['500 ft', '1 000 ft', '1 500 ft', '3 000 ft'], a: 2, exp: '500 × 3 = 1 500 ft.', how: 'Le variomètre donne la vitesse verticale en pieds par minute. Multiplier par la durée donne le gain d’altitude.', src: S_INS },
          { q: 'Combien de milles nautiques représente 1° de latitude ?', choices: ['1 NM', '10 NM', '60 NM', '100 NM'], a: 2, exp: '1° = 60 minutes d’arc = 60 NM.', how: 'Comme 1 minute d’arc de latitude vaut 1 NM, on peut mesurer les distances sur l’échelle des latitudes, sur le bord de n’importe quelle carte.', src: S_U },
          { q: 'Dans un METAR, que signifie une visibilité « 9999 » ?', choices: ['9 999 m exactement', '10 km ou plus', 'Visibilité inconnue', '99 km'], a: 1, exp: '9999 signifie 10 km ou plus.', how: 'Le code METAR limite la visibilité à 4 chiffres en mètres ; 9999 est la valeur maximale et veut dire « 10 km ou davantage ».', fig: 'metar', src: { label: 'OMM, Manuel des codes (WMO-No. 306), FM 15 METAR' } },
          { q: 'Une piste fait 1 000 m. Combien de pieds environ ?', choices: ['300 ft', '1 000 ft', '3 300 ft', '10 000 ft'], a: 2, exp: '1 000 m × 3,28 ≈ 3 280 ft.', how: 'Les longueurs de piste figurent en mètres sur les cartes françaises et en pieds sur d’autres documents : il faut savoir passer de l’un à l’autre.', src: S_U },
          { q: '« 120 nœuds par heure » : est-ce correct ?', choices: ['Oui', 'Non, le nœud est déjà une vitesse', 'Seulement en montée', 'Seulement en navigation'], a: 1, exp: 'Le nœud vaut déjà 1 NM par heure : on dit simplement 120 nœuds.', how: 'Dire « nœuds par heure » revient à parler d’une accélération. C’est une erreur fréquente chez les débutants.', src: S_U },
          { q: 'Quelle unité utilise-t-on pour régler l’altimètre en Europe ?', choices: ['Le pied', 'L’hectopascal', 'Le bar', 'Le kilogramme'], a: 1, exp: 'Le calage altimétrique se fait en hectopascals (hPa) ; aux États-Unis, en pouces de mercure.', how: 'On affiche dans la fenêtre de l’altimètre une pression de référence (QNH, QFE ou 1013) pour obtenir une altitude, une hauteur ou un niveau de vol.', fig: 'calage', src: S_U }
        ]
      },
      {
        id: 'fdm-3', title: 'Découverte du cockpit', domain: 'tech', duration: 25, verified: false,
        intro: 'Assieds-toi en place gauche. Voici à quoi sert chaque commande, chaque levier et chaque instrument d’un avion école.',
        sections: [
          { h: 'Les commandes de vol', html: '<ul><li><strong>Le manche</strong> (ou volant) : tourné à gauche ou à droite, il agit sur les <strong>ailerons</strong> (roulis) ; tiré ou poussé, sur la <strong>profondeur</strong> (tangage : nez qui monte ou descend).</li><li><strong>Les palonniers</strong> (pédales) : ils agissent sur la <strong>gouverne de direction</strong> (lacet : le nez part à gauche ou à droite). Au sol, ils servent aussi à diriger l’avion, et leur partie haute actionne les <strong>freins</strong>.</li><li><strong>Le compensateur</strong> (molette ou interrupteur, « trim ») : il supprime l’effort à tenir sur le manche.</li></ul>', fig: 'axes', caption: 'Les trois axes : roulis, tangage, lacet.', src: S_INS },
          { h: 'Les commandes du moteur', html: '<p>Sur un avion léger à moteur à pistons, les leviers suivent un code couleur standard :</p><table class="tbl"><thead><tr><th>Couleur</th><th>Commande</th><th>Rôle</th></tr></thead><tbody><tr><td><strong>Noir</strong></td><td>Manette des gaz</td><td>Puissance du moteur. Poussée = plein gaz.</td></tr><tr><td><strong>Bleu</strong></td><td>Pas d’hélice</td><td>Régime de l’hélice (si hélice à pas variable).</td></tr><tr><td><strong>Rouge</strong></td><td>Richesse (mixture)</td><td>Dosage essence/air. Tirée à fond = arrêt du moteur.</td></tr></tbody></table><p>On trouve aussi : la commande de <strong>réchauffage carburateur</strong> (contre le givrage), le <strong>sélecteur de réservoir</strong>, la <strong>pompe électrique</strong>, et le contacteur des <strong>magnétos</strong> (allumage : OFF, R, L, BOTH, START).</p>', tip: 'Moyen mnémotechnique : rouge comme le danger, c’est la richesse qui peut couper le moteur.', src: S_AFH },
          { h: 'Les instruments de base', html: '<p>Au centre du tableau de bord, six instruments forment le « T de base » : l’<strong>anémomètre</strong> (vitesse), l’<strong>horizon artificiel</strong> (assiette et inclinaison), l’<strong>altimètre</strong>, le <strong>coordinateur de virage</strong> avec sa bille, le <strong>conservateur de cap</strong> et le <strong>variomètre</strong>. Le <strong>compas magnétique</strong> est en général en haut du pare-brise.</p><p>Sur les avions récents, ces six instruments sont regroupés sur un écran : le <strong>PFD</strong> (Primary Flight Display).</p>', fig: 'six', caption: 'Le T de base : anémomètre, horizon, altimètre en haut ; virage, cap, variomètre en bas.', src: S_INS },
          { h: 'Radio, transpondeur et électricité', html: '<ul><li><strong>Le contacteur général</strong> (« master ») met le circuit électrique sous tension.</li><li><strong>La radio VHF</strong> : on y affiche la fréquence de la tour ou de l’information de vol.</li><li><strong>Le transpondeur</strong> : il répond au radar avec un code à 4 chiffres. 7000 est le code VFR par défaut en Europe ; 7700 signale une urgence.</li><li><strong>Le GPS</strong> et les instruments moteur (compte-tours, pression et température d’huile, jauges d’essence).</li></ul>', src: { label: 'Règlement (UE) n° 923/2012 (SERA.13005) ; FAA PHAK ch. 7' } }
        ],
        keypoints: ['Manche : ailerons (roulis) et profondeur (tangage). Palonniers : direction (lacet) et freins.', 'Code couleur : gaz noir, hélice bleu, richesse rouge.', 'Le T de base : 6 instruments, regroupés sur le PFD des avions modernes.', 'Transpondeur : 7000 VFR par défaut en Europe, 7700 urgence.'],
        sources: [S_INS, S_AFH],
        quiz: [
          { q: 'Que fait l’avion quand on tourne le manche vers la gauche ?', choices: ['Il s’incline à gauche (roulis)', 'Le nez monte', 'Le nez part à gauche sans s’incliner', 'Il accélère'], a: 0, exp: 'Le manche tourné à gauche braque les ailerons : l’aile gauche descend, l’avion s’incline à gauche.', how: 'L’aileron qui se lève diminue la portance de son aile, celui qui s’abaisse l’augmente : l’avion roule autour de son axe longitudinal.', fig: 'axes', src: S_INS },
          { q: 'Que fait le nez de l’avion quand on tire le manche ?', choices: ['Il descend', 'Il monte', 'Il part à droite', 'Rien'], a: 1, exp: 'Tirer le manche relève la gouverne de profondeur : la queue descend, le nez monte.', how: 'La profondeur agit sur le tangage, autour de l’axe transversal (celui des ailes).', fig: 'gouvernes', src: S_INS },
          { q: 'À quoi servent les palonniers en vol ?', choices: ['À freiner', 'À commander la gouverne de direction (lacet)', 'À sortir les volets', 'À régler la puissance'], a: 1, exp: 'En vol, les palonniers commandent la direction : le nez part à gauche ou à droite.', how: 'On s’en sert surtout pour garder le vol symétrique (bille au centre) en virage et pour contrer les effets moteur.', fig: 'axes', src: S_INS },
          { q: 'Au sol, comment freine-t-on sur la plupart des avions légers ?', choices: ['Avec le manche', 'En appuyant sur le haut des palonniers', 'Avec un levier rouge', 'En réduisant les gaz uniquement'], a: 1, exp: 'Les freins sont commandés en appuyant sur la partie haute des palonniers, chaque pied freinant sa roue.', how: 'Freiner plus d’un côté que de l’autre aide aussi à tourner au sol.', src: S_AFH },
          { q: 'De quelle couleur est la commande de richesse (mixture) ?', choices: ['Noire', 'Bleue', 'Rouge', 'Jaune'], a: 2, exp: 'La richesse est rouge.', how: 'Le rouge signale une commande qui peut couper le moteur : tirée à fond (« étouffoir »), elle arrête l’arrivée d’essence. C’est d’ailleurs ainsi qu’on arrête le moteur au parking.', src: S_AFH },
          { q: 'De quelle couleur est la manette des gaz ?', choices: ['Noire', 'Rouge', 'Bleue', 'Verte'], a: 0, exp: 'La manette des gaz est noire.', how: 'Sur un avion à hélice à pas variable, elle est accompagnée d’un levier bleu (hélice) et d’un levier rouge (richesse).', src: S_AFH },
          { q: 'À quoi sert le compensateur (trim) ?', choices: ['À augmenter la vitesse', 'À supprimer l’effort à tenir sur le manche', 'À freiner', 'À démarrer le moteur'], a: 1, exp: 'Le compensateur annule l’effort au manche pour une vitesse donnée.', how: 'Un petit volet (le tab) au bord de fuite de la profondeur est braqué par la molette : il crée une petite force aérodynamique qui maintient la gouverne en place sans effort du pilote.', fig: 'gouvernes', src: S_INS },
          { q: 'Que mesure l’anémomètre ?', choices: ['L’altitude', 'La vitesse par rapport à l’air', 'La vitesse par rapport au sol', 'Le cap'], a: 1, exp: 'L’anémomètre mesure la vitesse de l’avion par rapport à l’air (vitesse indiquée).', how: 'Il compare la pression mesurée par le tube de Pitot (face au vent) et la pression statique. C’est la vitesse qui compte pour voler : la portance dépend de l’air qui passe sur l’aile, pas du sol.', fig: 'anemo', src: S_INS },
          { q: 'Quel instrument montre si l’avion est incliné et si son nez est haut ou bas ?', choices: ['L’altimètre', 'L’horizon artificiel', 'Le variomètre', 'Le compas'], a: 1, exp: 'L’horizon artificiel indique l’assiette (nez haut ou bas) et l’inclinaison.', how: 'Un gyroscope garde une référence fixe dans l’espace : quand l’avion bouge autour de lui, l’instrument reproduit l’horizon réel. Il est indispensable dans les nuages.', fig: 'horizon', src: S_INS },
          { q: 'Que mesure le variomètre ?', choices: ['La vitesse horizontale', 'La vitesse verticale (montée ou descente)', 'La pression d’huile', 'Le régime moteur'], a: 1, exp: 'Le variomètre indique la vitesse verticale, en pieds par minute.', how: 'Il compare la pression statique actuelle à celle, un peu en retard, d’une chambre qui fuit lentement. Si la pression baisse, l’avion monte.', src: S_INS },
          { q: 'À quoi sert la bille du coordinateur de virage ?', choices: ['À indiquer le cap', 'À vérifier que le vol est symétrique', 'À mesurer l’altitude', 'À indiquer la vitesse'], a: 1, exp: 'La bille montre si l’avion glisse ou dérape : elle doit rester au centre.', how: 'Si la bille part d’un côté, on « marche sur la bille » : on appuie sur le palonnier du côté où elle se trouve pour la recentrer.', src: S_INS },
          { q: 'Qu’est-ce que le PFD ?', choices: ['Un plan de vol', 'L’écran principal de vol qui regroupe les instruments de base', 'Un permis de pilote', 'Un type de moteur'], a: 1, exp: 'Le PFD (Primary Flight Display) regroupe vitesse, horizon, altitude, variomètre et cap sur un seul écran.', how: 'Sur les avions de ligne et beaucoup d’avions légers récents, le PFD remplace les six instruments à aiguilles, avec la même logique de lecture (vitesse à gauche, altitude à droite).', src: { label: 'FAA, PHAK (FAA-H-8083-25), ch. 8 et Instrument Flying Handbook (FAA-H-8083-15)' } },
          { q: 'Quel code transpondeur un pilote VFR affiche-t-il par défaut en Europe ?', choices: ['1200', '7000', '7500', '7700'], a: 1, exp: 'En Europe, le code VFR par défaut est 7000.', how: '1200 est l’équivalent aux États-Unis. Les codes 7500, 7600 et 7700 sont réservés aux situations d’urgence (intervention illicite, panne radio, détresse).', src: S_SERA },
          { q: 'Que signale le code transpondeur 7700 ?', choices: ['Panne radio', 'Une urgence (détresse)', 'Vol VFR normal', 'Intervention illicite'], a: 1, exp: '7700 = urgence.', how: 'Afficher 7700 déclenche une alerte sur les écrans radar de tous les contrôleurs concernés. 7600 = panne radio ; 7500 = intervention illicite.', src: S_SERA },
          { q: 'À quoi sert le contacteur des magnétos ?', choices: ['À allumer la radio', 'À commander l’allumage du moteur', 'À allumer les phares', 'À sortir le train'], a: 1, exp: 'Les magnétos produisent l’étincelle des bougies, indépendamment de la batterie.', how: 'Un moteur d’avion a deux magnétos et deux bougies par cylindre, pour la sécurité. On vérifie chacune séparément avant le décollage (positions L et R).', fig: 'moteur', src: S_AFH },
          { q: 'Pourquoi un moteur d’avion a-t-il deux magnétos ?', choices: ['Pour aller plus vite', 'Pour la redondance : si une tombe en panne, l’autre suffit', 'Pour démarrer plus vite', 'Pour alimenter la radio'], a: 1, exp: 'Deux circuits d’allumage indépendants : le moteur continue de tourner si l’un tombe en panne.', how: 'Le principe de redondance est partout en aviation : deux magnétos, deux bougies par cylindre, deux sources de pression pour les instruments sur les avions plus gros.', src: S_AFH },
          { q: 'Où se trouve en général le compas magnétique dans un avion léger ?', choices: ['Sous le siège', 'En haut, près du pare-brise', 'Dans le moteur', 'Sur l’aile'], a: 1, exp: 'Le compas est souvent fixé en haut du tableau de bord ou du pare-brise.', how: 'On l’éloigne autant que possible des masses métalliques et des circuits électriques qui perturbent le champ magnétique.', src: S_INS },
          { q: 'À quoi sert le réchauffage carburateur ?', choices: ['À chauffer la cabine', 'À éviter ou faire fondre la glace dans le carburateur', 'À démarrer par temps froid', 'À augmenter la puissance'], a: 1, exp: 'Il envoie de l’air chaud dans le carburateur pour faire fondre la glace qui peut s’y former.', how: 'L’essence qui s’évapore et l’air qui accélère dans le carburateur refroidissent fortement : de la glace peut s’y former même par 20 °C si l’air est humide.', src: { label: 'FAA, PHAK (FAA-H-8083-25), ch. 7 « Carburetor Icing »' } }
        ]
      },
      {
        id: 'fdm-4', title: 'Le vocabulaire du pilote', domain: 'proc', duration: 15, verified: false,
        intro: 'VFR, IFR, QNH, METAR, NOTAM… Les sigles qui reviennent tout le temps, expliqués simplement.',
        sections: [

          html: '<p>La Terre est presque une sphère, légèrement aplatie aux pôles. On repère un point par sa <strong>latitude</strong> (0 à 90° Nord ou Sud) et sa <strong>longitude</strong> (0 à 180° Est ou Ouest).</p><p>Le <strong>mille nautique</strong> (NM) est la longueur d’<strong>une minute d’arc de latitude</strong> : <strong>1 NM = 1 852 m</strong>. Un nœud (kt) = 1 NM par heure.</p><p>Attention : une minute de <strong>longitude</strong> ne vaut 1 NM qu’à l’équateur. Ailleurs, elle vaut <strong>cos(latitude)</strong> NM. À 60° de latitude, 60 minutes de longitude ne font que 30 NM.</p>'

  function resetBlock() { return `<section><button class="btn ghost" id="reset-ask" type="button">Remettre ma progression à zéro</button><div class="confirm" id="reset-box" hidden><p style="margin:0">Effacer XP, grades, badges, scores, cours lus et bilan ? Cette action est définitive.</p><div class="btns"><button class="btn" id="reset-no" type="button">Annuler</button><button class="btn pri" id="reset-yes" type="button">Tout effacer</button></div></div></section>`; }

  // ---------- Quiz ----------
  let Q = null;
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const prep = it => Object.assign({}, it, { order: shuffle(it.q.choices.map((_, i) => i)), picked: null, idk: false });
  function seeded(seed) { let x = 0; for (const c of seed) x = (x * 31 + c.charCodeAt(0)) >>> 0; return () => { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; }; }
  function startQuiz(kind, ref) {
    let items = [], title = '', back = '#accueil', rush = 0;

    if (kind === 'quiz') { const m = MODS[ref]; items = shuffle(m.quiz.map((q, i) => ({ q, mod: m.id, i }))); title = m.title; back = '#etape-' + m.stage; }
    if (kind === 'examen') { const s = STAGES.find(x => x.id === ref); s.mods.forEach(m => m.quiz.forEach((q, i) => items.push({ q, mod: m.id, i }))); items = shuffle(items).slice(0, 20); title = 'Examen blanc · ' + s.name; back = '#etape-' + s.id; }
    if (kind === 'revision') { items = shuffle(dueKeys().map(k => { const [mod, i] = k.split('#'); return { q: MODS[mod].quiz[+i], mod, i: +i }; })).slice(0, 20); title = 'Révision espacée'; }
    if (kind === 'defi') { const rnd = seeded(today()); const pool = all(); const cur = STAGES.find(s => s.mods.some(m => !modDone(m))) || STAGES[0]; const mine = pool.filter(x => MODS[x.mod].stage === cur.id);
      const pickN = (arr, n) => { const a = arr.slice(); const out = []; while (a.length && out.length < n) out.push(a.splice(Math.floor(rnd() * a.length), 1)[0]); return out; };
      items = pickN(mine, 6).concat(pickN(pool.filter(x => !mine.includes(x)), 4)); title = 'Défi du jour'; }
    if (kind === 'jeu') { const g = GAMES.find(x => x.id === ref); title = g.name; back = '#simulateur'; items = Array.from({ length: g.n }, () => ({ q: window.gameQuestion(g), game: g.id })); }
    if (kind === 'rush') { const g = GAMES.find(x => x.id === ref); title = g.name + ' · chrono ' + g.rush + ' s'; back = '#simulateur'; rush = g.rush; items = Array.from({ length: 3 }, () => ({ q: window.gameQuestion(g), game: g.id })); }
    Q = { kind, ref, title, back, items: items.map(prep), cur: 0, done: false, exam: kind === 'examen', rush, t0: null, xp: 0 };
    combo = 0;
  }
  function viewQuiz() {
    if (!Q.items.length) return `<div class="crumbs"><a href="#accueil">Cockpit</a></div><section class="card"><h2>Rien à réviser pour l’instant</h2><p>Les questions que tu rates ou que tu ne connais pas reviennent ici au bon moment. Réponds à des quiz pour alimenter ta révision.</p><a class="btn pri" href="#accueil">Retour</a></section>`;
    if (Q.done) return viewResult();
    const it = Q.items[Q.cur], letters = 'ABCD', q = it.q;
    const answered = it.picked != null || it.idk, good = it.picked != null && it.order[it.picked] === q.a;
    const showFb = answered && !Q.exam;
    const src = it.mod ? MODS[it.mod] : null;
    const left = Q.rush ? Math.max(0, Q.rush - (Date.now() - (Q.t0 || Date.now())) / 1000) : 0;
    return `
      <div class="crumbs"><a href="#accueil">Cockpit</a><span>/</span><a href="${Q.back}">Retour</a></div>
      <section class="quiz">
        <div><div class="eyebrow">${{ quiz: 'Quiz du module', examen: 'Examen blanc', revision: 'Révision', defi: 'Défi du jour', jeu: 'Simulateur', rush: 'Contre la montre' }[Q.kind]}</div><h1 style="font-size:2rem">${esc(Q.title)}</h1></div>
        ${Q.rush ? `<div class="timerbar"><i id="rush-bar" style="width:${(left / Q.rush * 100).toFixed(1)}%"></i></div>` : `<div class="qsteps">${Q.items.map((x, i) => `<i class="${i === Q.cur ? 'cur' : x.picked == null && !x.idk ? '' : Q.exam ? 'cur' : x.picked != null && x.order[x.picked] === x.q.a ? 'ok' : 'ko'}"></i>`).join('')}</div>`}
        <div class="qhead"><span>${Q.rush ? `<span id="rush-left">${Math.ceil(left)} s</span> · score ${Q.items.filter(x => x.picked != null && x.order[x.picked] === x.q.a).length}` : `Question ${Q.cur + 1} / ${Q.items.length}`}</span><span class="combo ${combo >= 3 ? 'hot' : ''}">${combo >= 2 ? 'Combo ×' + combo : ''}</span><span>${src ? esc(src.title) : ''}</span></div>
        ${q.img ? photo(q.img) : ''}${q.qfig ? `<div class="qfig">${q.qfig}</div>` : ''}
        <p class="qtext">${esc(q.q)}</p>
        <div class="choices">${it.order.map((orig, k) => {
          let cls = '';
          if (answered && !Q.exam) { if (orig === q.a) cls = 'good'; else if (k === it.picked) cls = 'wrong'; }
          const mk = cls === 'good' ? '✓' : cls === 'wrong' ? '✗' : '';
          return `<button class="choice ${cls}" data-k="${k}" type="button" ${answered ? 'disabled' : ''} ${answered && Q.exam && k === it.picked ? 'style="border-color:var(--cyan)"' : ''}><span class="l">${letters[k]}</span><span>${esc(q.choices[orig])}</span><span class="mk">${mk}</span></button>`;
        }).join('')}</div>

        ${answered && !Q.rush ? `<div class="btns"><button class="btn pri" id="q-next" type="button">${Q.cur + 1 < Q.items.length ? 'Question suivante →' : 'Voir mon résultat →'}</button><span class="kbd">Clavier : 1 à 4 pour répondre, 0 pour « je ne sais pas », Entrée pour continuer</span></div>` : ''}
      </section>`;
  }
  function feedback(it, good) {
    const q = it.q;

    return `<div class="fb ${it.idk ? 'idk-fb' : good ? 'ok' : 'ko'}"><h3>${title}</h3>

  }
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function record(it, good) {
    if (!it.mod) return;
    const key = it.mod + '#' + it.i, now = dayNum(today());
    const s = P.q[key] || (P.q[key] = { box: 0, due: now, ok: 0, ko: 0 });
    if (good) { s.ok++; s.box = Math.min(s.box + 1, LEIT.length - 1); s.due = now + LEIT[s.box]; } else { s.ko++; s.box = 0; s.due = now; }
  }
  function answer(k, btn) {

  }

  function nextQ() {

  function finish() {
    Q.done = true; clearInterval(rushTimer);

    const score = answered.length ? nOk / answered.length : 0; Q.score = score; Q.nOk = nOk;
    let bonus = 0;
    if (Q.kind === 'quiz') { const s = mp(Q.ref); const wasDone = s.best != null && s.best >= PASS; s.attempts++; s.best = s.best == null ? score : Math.max(s.best, score); s.last = score; if (!wasDone && score >= PASS) bonus = 100; }
    if (Q.kind === 'examen') { const e = P.exams[Q.ref] || { best: 0, n: 0 }; const was = e.best >= PASS; e.n++; e.best = Math.max(e.best, score); e.last = score; P.exams[Q.ref] = e; if (!was && score >= PASS) bonus = 150; }

  function ring(p, ok) { const r = 54, c = 2 * Math.PI * r; return `<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Score ${pct(p)}"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--surf2)" stroke-width="12"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--${ok ? 'ok' : 'bad'})" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 70 70)"/><text x="70" y="78" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="26" font-weight="600" fill="var(--fg)">${Math.round(p * 100)}%</text></svg>`; }

  // ---------- Simulateur, badges ----------
  function viewSim() {
    renderNav('simulateur');
    return `<div class="crumbs"><a href="#accueil">Cockpit</a><span>/</span><span>Simulateur</span></div>
      <section style="display:grid;gap:10px"><div class="eyebrow">Entraînement illimité</div><h1>Simulateur</h1><p style="margin:0;max-width:65ch;color:var(--muted)">Chaque partie génère de nouvelles questions : impossible de les apprendre par cœur. Joue quelques minutes par jour, c’est là que les réflexes se construisent.</p></section>
      ${gamesGrid()}
      <section class="card"><div class="eyebrow">Défi chrono</div><h2 style="margin:.2em 0 .6em">Alphabet en 60 secondes</h2><p style="margin:0 0 10px;color:var(--muted)">Le plus de bonnes réponses possible en une minute. Record : ${(P.games.alphabet && P.games.alphabet.rush) || 0}.</p><a class="btn pri" href="#rush-alphabet">Lancer le chrono</a></section>`;
  }
  function viewBadges() {
    renderNav('badges');
    return `<div class="crumbs"><a href="#accueil">Cockpit</a><span>/</span><span>Badges</span></div>
      <section style="display:grid;gap:10px"><div class="eyebrow">${Object.keys(P.badges).length} / ${BADGES.length} débloqués</div><h1>Badges et grades</h1></section>
      <div class="badges">${BADGES.map(b => `<div class="card badge ${P.badges[b[0]] ? '' : 'off'}">${medal(b[3], !!P.badges[b[0]])}<b>${esc(b[1])}</b><span>${esc(b[2])}</span></div>`).join('')}</div>
      <section class="card"><div class="eyebrow">Les grades</div><table class="tbl" style="margin-top:10px"><thead><tr><th>Grade</th><th>XP</th></tr></thead><tbody>${RANKS.map((r, i) => `<tr ${i === rankOf(P.xp) ? 'style="font-weight:600;color:var(--magenta)"' : ''}><td>${esc(r[1])}</td><td class="mono">${r[0]}</td></tr>`).join('')}</tbody></table>
      <p style="color:var(--muted);font-size:.9rem">+10 XP par bonne réponse, jusqu’à +20 avec les combos · +20 par cours lu · +100 par module validé · +150 par examen blanc réussi · +50 pour le défi du jour.</p></section>`;
  }

  // ---------- Bilan d’aptitude ----------
  const AE = window.AE || [];
  function verdictPill(level) { return level === 2 ? '<span class="pill ok">feu vert</span>' : level === 1 ? '<span class="pill warn">à consolider</span>' : '<span class="pill bad">points bloquants</span>'; }
  function computeAuto(ans) {
    const scores = AE.map(a => ans[a.id] == null ? null : a.o[ans[a.id]][1]);
    const blockers = AE.filter((a, i) => scores[i] === 0 && ['sante', 'budget', 'anglais', 'mobilite'].includes(a.id)).length;
    const total = scores.reduce((s, x) => s + (x || 0), 0);
    let level = 2; if (blockers || total < 12) level = 0; else if (total < 17) level = 1;
    const years = +ans.ans || 3, age = +ans.age || 40, career = Math.max(0, 65 - (age + years));
    const summary = level === 2 ? `Profil favorable. Environ ${career} ans de carrière possibles.` : level === 1 ? `Projet réaliste, avec des points à préparer. Environ ${career} ans de carrière possibles.` : `Des points peuvent bloquer : traite-les avant d’investir. Environ ${career} ans de carrière possibles.`;
    return { level, total, career, summary };
  }
  function viewAuto() {
    renderNav('');
    const ans = (P.auto && P.auto.ans) || {}, res = P.auto && P.auto.result;
    const sel = 'font:inherit;background:var(--surf);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px';
    return `<div class="crumbs"><a href="#accueil">Cockpit</a><span>/</span><span>Bilan d’aptitude</span></div>
      <section style="display:grid;gap:10px;max-width:820px"><div class="eyebrow">Mesurer ta capacité</div><h1>Bilan d’aptitude</h1><p style="margin:0;color:var(--muted)">Réponds franchement : personne d’autre que toi ne voit ces réponses. Le bilan repère ce qui peut bloquer et te propose quoi faire. Il ne remplace pas l’avis d’un médecin aéronautique ni celui d’une école.</p></section>
      <form class="ae" id="ae-form" style="max-width:820px">
        <fieldset><legend>Ton âge aujourd’hui et la durée de formation visée</legend><div class="opts"><label class="o">Âge <input id="ae-age" name="age" type="number" min="17" max="64" value="${esc(ans.age || 40)}" style="width:70px;${sel}"></label>
          <label class="o">Durée jusqu’au premier poste <select id="ae-ans" name="ans" style="${sel}">${[2, 3, 4, 5].map(y => `<option value="${y}" ${(+ans.ans || 3) === y ? 'selected' : ''}>${y} ans</option>`).join('')}</select></label></div></fieldset>
        ${AE.map(a => `<fieldset><legend>${esc(a.q)}</legend><div class="opts">${a.o.map((o, i) => `<label class="o"><input type="radio" id="ae-${a.id}-${i}" name="${a.id}" value="${i}" ${ans[a.id] === i ? 'checked' : ''}>${esc(o[0])}</label>`).join('')}</div></fieldset>`).join('')}
        <div class="btns"><button class="btn pri" type="submit">Calculer mon bilan</button></div></form>
      ${res ? `<section class="card verdict" id="ae-result" style="max-width:820px"><div class="eyebrow">Ton bilan</div><h2>${verdictPill(res.level)} ${esc(res.summary)}</h2>
        <p style="margin:0;color:var(--muted)">Avec un premier poste de copilote à ${(+ans.age || 40) + (+ans.ans || 3)} ans, la limite de 65 ans laisse ${res.career} ans de vol commercial.</p>
        ${AE.map(a => { if (ans[a.id] == null) return `<div class="vrow"><span class="pill mut">sans réponse</span><p>${esc(a.q)}</p></div>`; const sc = a.o[ans[a.id]][1]; return `<div class="vrow"><span>${sc === 2 ? '<span class="pill ok">ok</span>' : sc === 1 ? '<span class="pill warn">à préparer</span>' : '<span class="pill bad">frein</span>'} <strong style="display:block;margin-top:6px">${esc(a.q.split(' :')[0].split('?')[0])}</strong></span><p>${esc(a.adv[ans[a.id]])}</p></div>`; }).join('')}
        <div class="tip"><b>Ensuite</b><span>1) Rendez-vous examen médical classe 1. 2) Vol d’initiation. 3) Étapes Fondamentaux puis ULM ou PPL de ce programme. 4) Seulement après, les engagements financiers lourds.</span></div></section>` : ''}`;
  }

  // ---------- Calcul mental chrono ----------
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const GEN = [
    () => { const v = [60, 90, 120, 150, 180][rnd(0, 4)], t = [10, 15, 20, 30, 40][rnd(0, 4)]; return [`À ${v} kt, quelle distance (NM) en ${t} min ?`, v * t / 60]; },
    () => { const v = [60, 90, 120, 180][rnd(0, 3)], d = v / 60 * [10, 20, 30, 40][rnd(0, 3)]; return [`${d} NM à ${v} kt : durée en minutes ?`, d / v * 60]; },
    () => { const c = rnd(1, 35) * 10 + [0, 5][rnd(0, 1)]; return [`Cap inverse de ${String(c).padStart(3, '0')}° ?`, (c + 180) % 360]; },
    () => { const q = rnd(5, 355); const n = Math.round(q / 10) || 36; return [`QFU ${String(q).padStart(3, '0')}° : numéro de piste ?`, n]; },
    () => { const c = [20, 24, 30, 36][rnd(0, 3)], m = [30, 45, 90, 105, 150][rnd(0, 4)]; return [`Consommation ${c} L/h, vol de ${m} min : litres consommés ?`, c * m / 60]; },
    () => { const d = [30, 60][rnd(0, 1)], e = rnd(1, 4); return [`Écart de ${e} NM après ${d} NM parcourus : erreur en degrés ?`, e * 60 / d]; },
    () => { const v = [80, 90, 100, 120, 140][rnd(0, 4)]; return [`Vitesse sol ${v} kt, pente 3° : vario approximatif (ft/min) ?`, v * 5]; },
    () => { const w = [10, 20, 30, 40][rnd(0, 3)]; return [`Vent ${w} kt à 30° de l’axe : composante traversière (kt) ?`, w / 2]; },
    () => { const fl = rnd(3, 12) * 10 + 5; return [`Niveau de vol FL ${String(fl).padStart(3, '0')} : altitude en ft (calage 1013) ?`, fl * 100]; },
    () => { const h = rnd(0, 23); return [`${String(h).padStart(2, '0')}h UTC : quelle heure à Nouméa (UTC+11) ?`, (h + 11) % 24]; }
  ];
  let C = null, cTimer = null;
  function viewChrono() {
    renderNav('simulateur');
    const hist = P.chrono.slice(-8).reverse();
    if (!C) return `<div class="crumbs"><a href="#accueil">Cockpit</a><span>/</span><a href="#simulateur">Simulateur</a><span>/</span><span>Calcul mental</span></div>
      <section style="display:grid;gap:12px;max-width:760px"><div class="eyebrow">Entraînement aux tests psychotechniques</div><h1>Calcul mental chrono</h1><p style="margin:0;color:var(--muted)">10 calculs de pilote, sans calculatrice, chronométrés. Vise 9/10 en moins de 15 s par question. +10 XP par bonne réponse.</p><div class="btns"><button class="btn pri" id="c-start" type="button">Démarrer</button></div></section>
      ${hist.length ? `<section class="card" style="max-width:760px"><div class="eyebrow">Tes dernières séries</div><table class="tbl" style="margin-top:8px"><thead><tr><th>Date</th><th>Score</th><th>Temps moyen</th></tr></thead><tbody>${hist.map(h => `<tr><td>${new Date(h.at).toLocaleDateString('fr-FR')}</td><td class="mono">${h.score}/10</td><td class="mono">${h.avg.toFixed(1)} s</td></tr>`).join('')}</tbody></table></section>` : ''}`;
    if (C.i >= C.qs.length) {
      const score = C.res.filter(r => r.ok).length, avg = C.res.reduce((a, r) => a + r.t, 0) / C.res.length;
      return `<div class="crumbs"><a href="#accueil">Cockpit</a><span>/</span><a href="#simulateur">Simulateur</a></div>
        <section class="quiz"><div class="result">${ring(score / 10, score >= 8)}<div><h1 style="font-size:2.2rem">${score}/10 · ${avg.toFixed(1)} s par calcul</h1><p style="color:var(--muted);margin:.4em 0 0">${score >= 9 && avg < 15 ? 'Niveau sélection atteint.' : 'Recommence demain : la régularité compte plus que la performance d’un jour.'}</p></div></div>
        <div class="review">${C.res.map(r => `<div class="card"><p><strong>${esc(r.q)}</strong></p><p class="${r.ok ? 'right' : 'yours'}">Ta réponse : ${esc(r.given)} ${r.ok ? '✓' : ''}</p>${r.ok ? '' : `<p class="right">Attendu : ${r.exp}</p>`}<p class="kbd">${r.t.toFixed(1)} s</p></div>`).join('')}</div>
        <div class="btns"><button class="btn pri" id="c-start" type="button">Nouvelle série</button><a class="btn" href="#simulateur">Simulateur</a></div></section>`;
    }
    const q = C.qs[C.i];
    return `<div class="crumbs"><a href="#accueil">Cockpit</a><span>/</span><span>Calcul mental chrono</span></div>
      <section class="quiz"><div class="qsteps">${C.qs.map((_, i) => `<i class="${i < C.i ? (C.res[i].ok ? 'ok' : 'ko') : i === C.i ? 'cur' : ''}"></i>`).join('')}</div>
      <div class="qhead"><span>Calcul ${C.i + 1} / 10</span><span class="timer" id="c-timer">0,0 s</span></div>
      <p class="chrono-q">${esc(q[0])}</p>
      <form class="chrono-in" id="c-form"><input id="c-in" inputmode="decimal" autocomplete="off" aria-label="Ta réponse"><button class="btn pri" type="submit">Valider</button></form></section>`;
  }
  function chronoStart() { C = { qs: shuffle(GEN).map(g => g()), i: 0, res: [], t0: performance.now() }; render(); chronoTick(); }
  function chronoTick() { clearInterval(cTimer); cTimer = setInterval(() => { const el = $('#c-timer'); if (!el || !C) { clearInterval(cTimer); return; } el.textContent = ((performance.now() - C.t0) / 1000).toFixed(1).replace('.', ',') + ' s'; }, 100); const inp = $('#c-in'); if (inp) inp.focus(); }
  function chronoAnswer(v) {
    const q = C.qs[C.i], t = (performance.now() - C.t0) / 1000;
    const num = parseFloat(String(v).replace(',', '.').replace(/\s/g, ''));
    const ok = !isNaN(num) && Math.abs(num - q[1]) < 0.01;
    C.res.push({ q: q[0], exp: String(q[1]).replace('.', ','), given: v || '(vide)', ok, t });
    if (ok) { gainXp(10, $('#c-in')); sound('ok'); } else sound('ko');
    C.i++; C.t0 = performance.now();
    if (C.i >= C.qs.length) { clearInterval(cTimer); const score = C.res.filter(r => r.ok).length, avg = C.res.reduce((a, r) => a + r.t, 0) / C.res.length; P.chrono.push({ at: Date.now(), score, avg }); P.chrono = P.chrono.slice(-30); checkBadges(); save(); render(); }
    else { save(); render(); chronoTick(); }
  }

  // ---------- Routeur ----------
  function render() {
    const h = (location.hash || '#accueil').slice(1);
    let html = '';
    const quizRoute = /^(quiz|examen|jeu|rush)-(.+)$/.exec(h) || (h === 'revision' || h === 'defi' ? [h, h, null] : null);
    if (h.startsWith('etape-')) html = viewStage(h.slice(6));
    else if (h.startsWith('cours-')) html = viewLesson(h.slice(6));
    else if (quizRoute) {
      const kind = quizRoute[1], ref = quizRoute[2];
      if (!Q) {
        if (kind === 'quiz' && !MODS[ref]) { location.hash = '#accueil'; return; }
        if (kind === 'examen' && !STAGES.find(s => s.id === ref && s.mods.length)) { location.hash = '#accueil'; return; }
        if ((kind === 'jeu' || kind === 'rush') && !GAMES.find(g => g.id === ref)) { location.hash = '#simulateur'; return; }
        startQuiz(kind, ref);
      }
      renderNav(Q.kind === 'revision' ? 'revision' : Q.kind === 'jeu' || Q.kind === 'rush' ? 'simulateur' : Q.kind === 'defi' ? 'accueil' : 'etape-' + (Q.kind === 'quiz' ? MODS[Q.ref].stage : Q.ref));
      html = viewQuiz();
    }
    else if (h === 'auto-evaluation') html = viewAuto();
    else if (h === 'chrono') html = viewChrono();
    else if (h === 'simulateur') html = viewSim();
    else if (h === 'badges') html = viewBadges();
    else html = viewHome();
    $('#view').innerHTML = html;
    renderHud();
    if (Q && Q.rush && !Q.done && !Q.t0 && quizRoute) startRush();
  }
  function route() { Q = null; clearInterval(rushTimer); if (location.hash !== '#chrono') { C = null; clearInterval(cTimer); } render(); window.scrollTo({ top: 0 }); }
  window.addEventListener('hashchange', route);

  document.addEventListener('click', e => {
    const t = e.target.closest('button, a'); if (!t) return;
    if (t.classList.contains('choice')) return answer(+t.dataset.k, t);
    if (t.id === 'q-idk') return idk();
    if (t.id === 'q-next') return nextQ();
    if (t.id === 'snd') { P.sound = !P.sound; save(); if (P.sound) sound('ok'); return; }
    if (t.dataset.retry) { e.preventDefault(); Q = null; if (location.hash === t.getAttribute('href')) render(); else location.hash = t.getAttribute('href'); window.scrollTo({ top: 0 }); return; }
    if (t.id === 'read-go') { const m = mp(t.dataset.id); if (!m.read) { m.read = true; gainXp(20, t); } save(); location.hash = '#quiz-' + t.dataset.id; return; }
    if (t.id === 'c-start') return chronoStart();
    if (t.id === 'reset-ask') { $('#reset-box').hidden = false; t.hidden = true; return; }
    if (t.id === 'reset-no') { $('#reset-box').hidden = true; $('#reset-ask').hidden = false; return; }
    if (t.id === 'reset-yes') { const snd = P.sound; P = blank(); P.sound = snd; save(); render(); return; }
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'c-form') return chronoAnswer($('#c-in').value.trim());
    if (e.target.id === 'ae-form') {
      const fd = new FormData(e.target), ans = { age: fd.get('age'), ans: fd.get('ans') };
      AE.forEach(a => { const v = fd.get(a.id); if (v != null) ans[a.id] = +v; });
      P.auto = { ans, result: computeAuto(ans), at: Date.now() }; save(); render();
      const r = $('#ae-result'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
  document.addEventListener('keydown', e => {
    if (!Q || Q.done || !/^#(quiz|examen|revision|defi|jeu|rush)/.test(location.hash)) return;
    if (e.target.matches('input, select, textarea')) return;
    const it = Q.items[Q.cur]; if (!it) return;
    const open = it.picked == null && !it.idk;
    if (open && /^[1-4]$/.test(e.key) && +e.key <= it.order.length) { e.preventDefault(); answer(+e.key - 1, document.querySelectorAll('.choice')[+e.key - 1]); }
    else if (open && e.key === '0' && !Q.exam && !Q.rush) { e.preventDefault(); idk(); }
    else if (!open && e.key === 'Enter' && !e.target.matches('button, a')) { e.preventDefault(); nextQ(); }
  });

  render();
  initCloud();
})();
</script>
