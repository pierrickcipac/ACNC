<title>Objectif Pilote de Ligne</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>/* Concept : un carnet de vol façon cockpit. Routes actives en magenta (comme sur un écran de navigation), valeurs sélectionnées en cyan, instruments sur fond noir. */
:root {
  --bg: #EDF1F5; --surf: #FFFFFF; --surf2: #E1E7EE; --fg: #0F1B2D; --muted: #56677C; --line: #CAD3DE;
  --magenta: #A8127A; --cyan: #08789C; --ok: #1C7D47; --warn: #A66A0C; --bad: #BE2F2F;
  --sky: #3E86C4; --ground: #8E6239; --panel: #151C27; --panel-fg: #F2F5F8; --bezel: #39424F; --mock: #F29A1F;
  --cloud: #FFFFFF; --dark: #8C97A6; --cheese: #F3D27A;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A111C; --surf: #111B2A; --surf2: #1A2739; --fg: #E3EBF4; --muted: #92A3B9; --line: #283850;
  --magenta: #F065C4; --cyan: #4DC6EC; --ok: #4CC17E; --warn: #E8B54A; --bad: #FF7D7D;
  --sky: #2D6CA3; --ground: #76502D; --panel: #05080D; --panel-fg: #EDF2F7; --bezel: #2E3744; --mock: #F29A1F;
  --cloud: #2A3A50; --dark: #5A6880; --cheese: #8E7430; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0A111C; --surf: #111B2A; --surf2: #1A2739; --fg: #E3EBF4; --muted: #92A3B9; --line: #283850;
  --magenta: #F065C4; --cyan: #4DC6EC; --ok: #4CC17E; --warn: #E8B54A; --bad: #FF7D7D;
  --sky: #2D6CA3; --ground: #76502D; --panel: #05080D; --panel-fg: #EDF2F7; --bezel: #2E3744; --mock: #F29A1F;
  --cloud: #2A3A50; --dark: #5A6880; --cheese: #8E7430; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.55; margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 5vw, 2.9rem); }
h2 { font-size: 1.75rem; }
h3 { font-size: 1.3rem; }
a { color: var(--cyan); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--panel); color: var(--panel-fg); border-bottom: 2px solid var(--magenta); }
.top-in { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: inherit; }
.brand b { font-family: var(--f-display); font-size: 1.45rem; letter-spacing: .04em; text-transform: uppercase; }
.brand span { font-family: var(--f-mono); font-size: .72rem; color: #9FB0C4; }
.top nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
@media (max-width: 700px) { .top nav { flex-wrap: nowrap; overflow-x: auto; margin-left: 0; flex-basis: 100%; scrollbar-width: none; } .top nav a { white-space: nowrap; } .brand span { display: none; } }
.top nav a { color: #C9D5E2; text-decoration: none; font-family: var(--f-mono); font-size: .8rem; padding: 6px 10px; border-radius: 6px; letter-spacing: .04em; }
.top nav a:hover { background: #ffffff14; }
.top nav a.on { background: #ffffff1c; color: #fff; box-shadow: inset 0 -2px 0 var(--magenta); }
.topbar { flex-basis: 100%; display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: .74rem; color: #9FB0C4; }
.topbar .bar { flex: 1; height: 6px; background: #ffffff1a; border-radius: 3px; overflow: hidden; }
.topbar .bar i { display: block; height: 100%; background: #F065C4; border-radius: 3px; transition: width .6s; }

main { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.view { display: grid; gap: 28px; }
.crumbs { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surf); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--fg); min-height: 44px; }
.btn:hover { border-color: var(--cyan); }
.btn.pri { background: var(--magenta); border-color: var(--magenta); color: #fff; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }

.card { background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }

.pbar { height: 8px; background: var(--surf2); border-radius: 4px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--magenta); border-radius: 4px; transition: width .6s; }
.pbar.cy i { background: var(--cyan); }

/* Tableau de bord */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: center; }
.hero p { max-width: 62ch; color: var(--muted); margin: 10px 0 0; }
.gauge { width: 210px; max-width: 100%; }
.gauge text { font-family: var(--f-mono); }
@media (max-width: 640px) { .hero { grid-template-columns: 1fr; } .gauge { margin: 0 auto; } }

.stage { display: grid; gap: 12px; text-decoration: none; color: inherit; position: relative; }
.stage:hover { border-color: var(--magenta); }
.stage .code { font-family: var(--f-display); font-size: 2.3rem; font-weight: 700; line-height: 1; }
.stage .meta { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.stage p { margin: 0; color: var(--muted); font-size: .92rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.mut { color: var(--muted); } .pill.cy { color: var(--cyan); } .pill.mag { color: var(--magenta); }

.next { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; border-left: 4px solid var(--magenta); }
@media (max-width: 560px) { .next { grid-template-columns: 1fr; } }

.skills { display: grid; gap: 12px; }
.skill { display: grid; grid-template-columns: 170px minmax(0, 1fr) 84px; gap: 12px; align-items: center; font-size: .92rem; }
.skill .v { font-family: var(--f-mono); text-align: right; font-size: .8rem; white-space: nowrap; }
.skill .v.na { color: var(--muted); }
@media (max-width: 520px) { .skill { grid-template-columns: 1fr 84px; } .skill .pbar { grid-column: 1 / -1; grid-row: 2; } }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat b { display: block; font-family: var(--f-mono); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--muted); }

/* Étape */
.mods { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mod { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.mod .n { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; border: 2px solid var(--line); }
.mod.done .n { background: var(--ok); border-color: var(--ok); color: #fff; }
.mod.prog .n { border-color: var(--magenta); color: var(--magenta); }
.mod h3 { font-size: 1.2rem; }
.mod .sub { font-size: .85rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.mod .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 640px) { .mod { grid-template-columns: 44px minmax(0, 1fr); } .mod .acts { grid-column: 1 / -1; justify-content: flex-start; } }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.facts div { border-top: 2px solid var(--cyan); padding-top: 8px; }
.facts b { display: block; font-family: var(--f-mono); font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }

/* Cours */
.lesson { max-width: 820px; display: grid; gap: 26px; }
.lesson .intro { font-size: 1.12rem; color: var(--muted); max-width: 65ch; margin: 8px 0 0; }
.sec { display: grid; gap: 12px; }
.sec h2 { font-size: 1.6rem; display: flex; gap: 12px; align-items: baseline; }
.sec h2 .k { font-family: var(--f-mono); font-size: .85rem; color: var(--magenta); font-weight: 500; }
.prose { max-width: 68ch; }
.prose p { margin: 0 0 .8em; }
.prose ul, .prose ol { margin: 0 0 .8em; padding-left: 1.3em; display: grid; gap: .35em; }
.prose code { font-family: var(--f-mono); background: var(--surf2); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
.tblwrap { overflow-x: auto; }
.tbl { border-collapse: collapse; width: 100%; font-size: .93rem; margin: 0 0 .8em; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-family: var(--f-mono); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; }
figure { margin: 0; background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; overflow-x: auto; }
figure figcaption { font-size: .85rem; color: var(--muted); margin-top: 8px; }
.tip { border: 1px dashed var(--cyan); border-radius: var(--r); padding: 12px 14px; font-size: .95rem; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.tip b { font-family: var(--f-mono); font-size: .72rem; color: var(--cyan); letter-spacing: .1em; text-transform: uppercase; padding-top: 3px; }
.keys { background: var(--panel); color: var(--panel-fg); border-radius: var(--r); padding: 20px 22px; }
.keys h3 { color: #fff; margin-bottom: 10px; }
.keys ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.keys li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; }
.keys li::before { content: "✓"; color: #4CC17E; font-weight: 700; }
.links { display: grid; gap: 6px; }
.links a { font-size: .95rem; }

/* Schémas */
svg.fig { width: 100%; height: auto; display: block; margin: 0 auto; overflow: visible; }
svg.fig text { font-family: var(--f-mono); fill: var(--fg); font-size: 13px; }
svg.fig .t { font-size: 14px; } svg.fig .t-sm { font-size: 12.5px; } svg.fig .t-xs { font-size: 11px; }
svg.fig .t-b { font-weight: 600; } svg.fig .t-big { font-size: 34px; font-weight: 700; font-family: var(--f-display); }
svg.fig .t-mut { fill: var(--muted); } svg.fig .t-acc { fill: var(--magenta); } svg.fig .t-cy { fill: var(--cyan); }
svg.fig .t-ok { fill: var(--ok); } svg.fig .t-warn { fill: var(--warn); } svg.fig .t-bad { fill: var(--bad); } svg.fig .t-pfg { fill: var(--panel-fg); }
svg.fig .t-run { font-family: var(--f-display); font-size: 34px; font-weight: 700; fill: #f5f7fa; }
svg.fig line, svg.fig path, svg.fig polygon, svg.fig rect, svg.fig circle, svg.fig ellipse { stroke-linecap: round; }
.st-fg { stroke: var(--fg); } .st-mut { stroke: var(--muted); } .st-acc { stroke: var(--magenta); } .st-cy { stroke: var(--cyan); }
.st-ok { stroke: var(--ok); } .st-warn { stroke: var(--warn); } .st-bad { stroke: var(--bad); } .st-pfg { stroke: var(--panel-fg); } .st-mock { stroke: var(--mock); }
.fl-fg { fill: var(--fg); } .fl-mut { fill: var(--muted); } .fl-acc { fill: var(--magenta); } .fl-cy { fill: var(--cyan); }
.fl-ok { fill: var(--ok); } .fl-warn { fill: var(--warn); } .fl-bad { fill: var(--bad); } .fl-pfg { fill: var(--panel-fg); } .fl-mock { fill: var(--mock); }
.fl-bg { fill: var(--bg); } .fl-surf { fill: var(--surf); } .fl-surf2 { fill: var(--surf2); } .fl-panel { fill: var(--panel); } .fl-bezel { fill: var(--bezel); }
.fl-sky { fill: var(--sky); } .fl-ground { fill: var(--ground); } .fl-cloud { fill: var(--cloud); } .fl-dark { fill: var(--dark); } .fl-cheese { fill: var(--cheese); }
.metar { display: grid; gap: 14px; }
.metar-line { font-family: var(--f-mono); font-size: 1.05rem; background: var(--panel); color: var(--panel-fg); padding: 12px 14px; border-radius: 8px; line-height: 2; }
.metar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 16px; font-size: .9rem; }
.metar-grid div { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.metar-note { font-size: .8rem; color: var(--muted); margin: 0; }
.mt { font-family: var(--f-mono); font-weight: 600; border-bottom: 3px solid; padding: 0 2px; }
.mt-acc { border-color: var(--magenta); } .mt-cy { border-color: var(--cyan); } .mt-ok { border-color: var(--ok); } .mt-warn { border-color: var(--warn); } .mt-mut { border-color: var(--muted); }
.metar-line .mt-acc { border-color: #F065C4; } .metar-line .mt-cy { border-color: #4DC6EC; } .metar-line .mt-ok { border-color: #4CC17E; } .metar-line .mt-warn { border-color: #E8B54A; } .metar-line .mt-mut { border-color: #92A3B9; }
.otan { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.otan div { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; background: var(--surf2); border-radius: 6px; }
.otan b { font-family: var(--f-display); font-size: 1.3rem; color: var(--magenta); width: 16px; }
.otan span { font-family: var(--f-mono); font-size: .85rem; }
.route { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; counter-reset: r; }
.route li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; background: var(--surf2); border-radius: 8px; padding: 10px; }
.route-n { width: 34px; height: 34px; border-radius: 50%; background: var(--magenta); color: #fff; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; }
.route strong { display: block; font-family: var(--f-display); font-size: 1.15rem; }
.route div span { display: block; font-size: .85rem; }
.route em { display: block; font-family: var(--f-mono); font-size: .74rem; color: var(--muted); font-style: normal; margin-top: 2px; }

/* Quiz */
.quiz { max-width: 780px; display: grid; gap: 20px; }
.qsteps { display: flex; gap: 4px; }
.qsteps i { flex: 1; height: 6px; border-radius: 3px; background: var(--surf2); }
.qsteps i.ok { background: var(--ok); } .qsteps i.ko { background: var(--bad); } .qsteps i.cur { background: var(--cyan); }
.qhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--f-mono); font-size: .82rem; color: var(--muted); }
.qtext { font-size: 1.3rem; font-weight: 600; line-height: 1.4; margin: 0; }
.choices { display: grid; gap: 10px; }
.choice { display: grid; grid-template-columns: 34px minmax(0, 1fr) 24px; gap: 12px; align-items: center; text-align: left; background: var(--surf); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 14px; cursor: pointer; min-height: 56px; }
.choice:hover:not(:disabled) { border-color: var(--cyan); }
.choice .l { width: 34px; height: 34px; border-radius: 8px; background: var(--surf2); display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; }
.choice:disabled { cursor: default; }
.choice.good { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--surf)); }
.choice.good .l { background: var(--ok); color: #fff; }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surf)); }
.choice.wrong .l { background: var(--bad); color: #fff; }
.choice .mk { font-weight: 700; font-size: 1.1rem; }
.choice.good .mk { color: var(--ok); } .choice.wrong .mk { color: var(--bad); }
.fb { border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; border: 1.5px solid; }
.fb.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 7%, var(--surf)); }
.fb.ko { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 6%, var(--surf)); }
.fb h3 { font-size: 1.3rem; }
.fb.ok h3 { color: var(--ok); } .fb.ko h3 { color: var(--bad); }
.fb p { margin: 0; }
.fb figure { background: var(--surf); }
.kbd { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.result { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; }
@media (max-width: 560px) { .result { grid-template-columns: 1fr; } }
.review { display: grid; gap: 12px; }
.review .card { display: grid; gap: 6px; }
.review .card p { margin: 0; }
.review .yours { color: var(--bad); font-size: .9rem; } .review .right { color: var(--ok); font-size: .9rem; font-weight: 600; }

/* Auto-évaluation et chrono */
.ae { display: grid; gap: 14px; }
.ae fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin: 0; background: var(--surf); min-width: 0; }
.ae legend { font-weight: 600; padding: 0 6px; }
.ae .opts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.ae label.o { display: inline-flex; gap: 8px; align-items: center; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: .93rem; }
.ae label.o:has(input:checked) { border-color: var(--cyan); background: color-mix(in srgb, var(--cyan) 10%, var(--surf)); }
.ae input[type=radio] { accent-color: var(--cyan); }
.ae .hint { font-size: .85rem; color: var(--muted); margin: 4px 0 0; }
.verdict { display: grid; gap: 10px; }
.vrow { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.vrow p { margin: 0; font-size: .93rem; }
@media (max-width: 560px) { .vrow { grid-template-columns: 1fr; } }
.chrono-q { font-family: var(--f-mono); font-size: 1.25rem; font-weight: 500; }
.chrono-in { display: flex; gap: 10px; flex-wrap: wrap; }
.chrono-in input { font-family: var(--f-mono); font-size: 1.4rem; width: 180px; max-width: 100%; padding: 10px 12px; border: 2px solid var(--line); border-radius: 8px; background: var(--surf); color: var(--fg); }
.chrono-in input:focus { border-color: var(--cyan); outline: none; }
.timer { font-family: var(--f-mono); font-size: 2rem; font-variant-numeric: tabular-nums; }
.confirm { border: 1.5px solid var(--bad); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.sync { font-family: var(--f-mono); font-size: .72rem; }
.foot { font-size: .82rem; color: var(--muted); max-width: 75ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ===== v2 : couche ludique ===== */
.hud { flex-basis: 100%; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-family: var(--f-mono); font-size: .76rem; color: #9FB0C4; }
.hud .rank { display: inline-flex; align-items: center; gap: 8px; color: #fff; font-weight: 600; }
.hud .rank svg { width: 26px; height: 26px; }
.hud .xpbar { flex: 1; min-width: 120px; height: 8px; background: #ffffff1a; border-radius: 4px; overflow: hidden; }
.hud .xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #F065C4, #4DC6EC); border-radius: 4px; transition: width .6s; }
.hud .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; background: #ffffff12; color: #E3EBF4; white-space: nowrap; }
.hud .chip svg { width: 15px; height: 15px; }
.hud button.chip { border: 0; cursor: pointer; }
.goal-ring { width: 18px; height: 18px; }
.xp-float { position: fixed; z-index: 50; pointer-events: none; font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; color: var(--ok); animation: xpf 1.1s ease-out forwards; text-shadow: 0 1px 0 var(--surf); }
@keyframes xpf { from { opacity: 0; transform: translateY(8px) scale(.8); } 20% { opacity: 1; transform: translateY(0) scale(1.1); } to { opacity: 0; transform: translateY(-46px) scale(1); } }
.combo { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; color: var(--magenta); display: inline-flex; gap: 6px; align-items: center; }
.combo.hot { animation: pulse .5s; }
@keyframes pulse { 50% { transform: scale(1.18); } }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--panel); color: var(--panel-fg); border: 2px solid var(--magenta); border-radius: 12px; padding: 12px 18px; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px #0006; max-width: calc(100% - 32px); animation: toastin .4s ease-out; }
.toast b { font-family: var(--f-display); font-size: 1.2rem; display: block; }
.toast svg { width: 42px; height: 42px; flex: none; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 20px); } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 55; }
.idk { background: transparent; border: 1.5px dashed var(--muted); color: var(--muted); }
.idk:hover { border-color: var(--cyan); color: var(--fg); }
.fb .why, .fb .how { display: grid; gap: 4px; }
.fb .lbl { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fb .src { font-size: .82rem; color: var(--muted); }
.fb.idk-fb { border-color: var(--cyan); background: color-mix(in srgb, var(--cyan) 6%, var(--surf)); }
.fb.idk-fb h3 { color: var(--cyan); }
.qfig { background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; place-items: center; overflow-x: auto; }
.qfig svg { max-width: 420px; width: 100%; height: auto; }
.photo { margin: 0; background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.photo img { display: block; width: 100%; height: auto; max-height: 520px; object-fit: contain; background: var(--surf2); }
.photo figcaption { padding: 8px 12px; }
.photo .credit { display: block; font-size: .72rem; color: var(--muted); margin-top: 2px; }
.pill.unv { color: var(--warn); border-style: dashed; }
/* Carte de route */
.routemap { display: grid; gap: 22px; }
.leg { display: grid; gap: 10px; }
.leg-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.leg-h b { font-family: var(--f-display); font-size: 1.35rem; }
.wps { display: flex; flex-wrap: wrap; gap: 0; align-items: center; row-gap: 14px; }
.wp { display: flex; align-items: center; }
.wp a { width: 46px; height: 46px; display: grid; place-items: center; text-decoration: none; color: var(--fg); position: relative; }
.wp a svg { width: 46px; height: 46px; }
.wp a:hover svg { transform: scale(1.12); }
.wp .conn { width: 26px; height: 3px; background: var(--line); }
.wp.done .conn, .wp.cur .conn { background: var(--magenta); }
.wp a .tip-t { position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%); background: var(--panel); color: var(--panel-fg); font-size: .78rem; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 3; }
.wp a:hover .tip-t, .wp a:focus-visible .tip-t { opacity: 1; }
/* Rang */
.rankcard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; background: var(--panel); color: var(--panel-fg); border: 0; }
.rankcard svg.ins { width: 96px; height: 96px; }
.rankcard h2 { color: #fff; }
.rankcard .sub { color: #9FB0C4; font-size: .9rem; }
.rankcard .xpbar { height: 10px; background: #ffffff1a; border-radius: 5px; overflow: hidden; margin-top: 10px; }
.rankcard .xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #F065C4, #4DC6EC); }
.daily { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.daily svg { width: 74px; height: 74px; }
/* Jeux */
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.game { display: grid; gap: 10px; text-decoration: none; color: inherit; }
.game:hover { border-color: var(--magenta); }
.game .gi { width: 56px; height: 56px; border-radius: 12px; background: var(--panel); display: grid; place-items: center; }
.game .gi svg { width: 40px; height: 40px; }
.game p { margin: 0; color: var(--muted); font-size: .9rem; }
.game .meta { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge { display: grid; justify-items: center; text-align: center; gap: 6px; padding: 14px 10px; }
.badge svg { width: 64px; height: 64px; }
.badge.off { opacity: .45; filter: grayscale(1); }
.badge b { font-size: .92rem; }
.badge span { font-size: .78rem; color: var(--muted); }
.timerbar { height: 6px; background: var(--surf2); border-radius: 3px; overflow: hidden; }
.timerbar i { display: block; height: 100%; background: var(--warn); transition: width .2s linear; }
.flash { perspective: 900px; }
.flash .card { min-height: 180px; display: grid; place-items: center; text-align: center; font-size: 1.2rem; cursor: pointer; }
@media (max-width: 700px) {
  .top { position: static; }
  .hud .sync, .hud .mono { display: none; }
  .hud { gap: 8px; }
}

<script>/* ---- figures.js ---- */
/* Schémas pédagogiques dessinés en SVG. Couleurs via classes CSS (thème clair/sombre). */
(function () {
  const R = Math.PI / 180;
  const T = (x, y, s, cls = '', anchor = 'middle') =>
    `<text x="${x}" y="${y}" text-anchor="${anchor}" class="${cls}">${s}</text>`;
  const L = (x1, y1, x2, y2, cls = 'st-fg', w = 2, extra = '') =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}" stroke-width="${w}" ${extra}/>`;
  function A(x1, y1, x2, y2, c = 'acc', w = 2.5, h = 10) {
    const a = Math.atan2(y2 - y1, x2 - x1);
    const p1 = [x2 - h * Math.cos(a - 0.42), y2 - h * Math.sin(a - 0.42)];
    const p2 = [x2 - h * Math.cos(a + 0.42), y2 - h * Math.sin(a + 0.42)];
    const bx = x2 - h * 0.8 * Math.cos(a), by = y2 - h * 0.8 * Math.sin(a);
    return L(x1, y1, bx.toFixed(1), by.toFixed(1), 'st-' + c, w) +
      `<polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" class="fl-${c}"/>`;
  }
  const svg = (w, h, body, label) =>
    `<svg class="fig" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" style="max-width:${w}px">${body}</svg>`;

  // Silhouette avion de profil (nez à droite), centrée en 0,0
  const planeSide = (cls = 'fl-surf2 st-fg') =>
    `<g class="${cls}" stroke-width="1.6" stroke-linejoin="round">
      <path d="M-100,-2 L-112,-38 L-96,-38 L-74,-9 Z"/>
      <path d="M-104,0 L-88,-9 L20,-14 L62,-12 L92,-4 L100,1 L92,8 L50,12 L-60,6 L-104,2 Z"/>
      <path d="M-12,-16 L48,-16 L48,-12 L-12,-12 Z"/>
      <path d="M-112,-1 L-82,-1 L-82,2 L-112,2 Z"/>
      <path d="M28,-12 L52,-12 L70,-4 L30,-4 Z" class="fl-cy" opacity=".35"/>
      <line x1="103" y1="-20" x2="103" y2="22" class="st-fg" stroke-width="3"/>
      <line x1="40" y1="11" x2="44" y2="26" class="st-fg"/><circle cx="44" cy="28" r="4" class="fl-fg"/>
      <line x1="-30" y1="7" x2="-36" y2="26" class="st-fg"/><circle cx="-36" cy="28" r="4" class="fl-fg"/>
    </g>`;
  // Silhouette avion vue de dessus (nez en haut), centrée en 0,0
  const planeTop = (cls = 'fl-surf2 st-fg') =>
    `<g class="${cls}" stroke-width="1.6" stroke-linejoin="round">
      <path d="M0,-110 C10,-108 14,-90 14,-60 L12,80 L6,110 L-6,110 L-12,80 L-14,-60 C-14,-90 -10,-108 0,-110 Z"/>
      <path d="M-150,-30 L150,-30 L150,0 L-150,0 Z"/>
      <path d="M-55,92 L55,92 L55,112 L-55,112 Z"/>
    </g>`;

  const F = {};

  F.axes = () => svg(640, 400, `
    <g transform="translate(320,215)">${planeTop()}
      ${L(0, -165, 0, 160, 'st-acc', 2.5, 'stroke-dasharray="8 5"')}
      ${L(-210, -15, 210, -15, 'st-cy', 2.5, 'stroke-dasharray="8 5"')}
      <circle cx="0" cy="-15" r="9" class="fl-ok"/><circle cx="0" cy="-15" r="3" class="fl-bg"/>
      <path d="M-26,-165 A30,12 0 1 0 26,-165" class="st-acc" stroke-width="2.5" fill="none"/>
      <polygon points="26,-165 16,-171 18,-160" class="fl-acc"/>
      <path d="M222,-45 A12,30 0 1 1 222,15" class="st-cy" stroke-width="2.5" fill="none"/>
      <polygon points="222,15 216,5 228,6" class="fl-cy"/>
      <path d="M-34,-15 A34,34 0 0 1 0,-49" class="st-ok" stroke-width="2.5" fill="none"/>
      <polygon points="0,-49 -10,-55 -9,-43" class="fl-ok"/>
    </g>
    ${T(360, 26, 'Axe longitudinal → ROULIS', 't t-b t-acc', 'start')}
    ${T(360, 44, 'ailerons · manche gauche / droite', 't-sm', 'start')}
    ${T(14, 150, 'Axe transversal → TANGAGE', 't t-b t-cy', 'start')}
    ${T(14, 168, 'profondeur · manche avant / arrière', 't-sm', 'start')}
    ${T(380, 330, 'Axe vertical (point vert) → LACET', 't t-b t-ok', 'start')}
    ${T(380, 348, 'direction · palonnier', 't-sm', 'start')}
    ${T(380, 366, 'les 3 axes passent par le centre de gravité', 't-xs t-mut', 'start')}
  `, 'Les trois axes de l’avion');

  F.forces = () => svg(560, 330, `
    <g transform="translate(270,170)">${planeSide()}
      ${A(0, -20, 0, -135, 'cy', 4, 14)}${A(0, 10, 0, 125, 'fg', 4, 14)}
      ${A(108, 0, 220, 0, 'acc', 4, 14)}${A(-110, 0, -225, 0, 'mut', 4, 14)}
    </g>
    ${T(285, 30, 'PORTANCE', 't t-b t-cy', 'start')}${T(285, 47, 'générée par l’aile', 't-sm', 'start')}
    ${T(285, 300, 'POIDS', 't t-b', 'start')}${T(285, 317, 'masse × gravité', 't-sm', 'start')}
    ${T(490, 150, 'TRACTION', 't t-b t-acc')}${T(490, 167, 'hélice / moteur', 't-sm')}
    ${T(60, 150, 'TRAÎNÉE', 't t-b t-mut')}${T(60, 167, 'résistance de l’air', 't-sm')}
    ${T(80, 250, 'Palier stabilisé :', 't-sm t-b', 'start')}${T(80, 267, 'Portance = Poids', 't-sm', 'start')}${T(80, 284, 'Traction = Traînée', 't-sm', 'start')}
  `, 'Les quatre forces');

  F.profil = () => {
    const af = 'M0,0 C10,-26 70,-40 150,-36 C260,-30 360,-12 440,0 C360,6 260,10 150,12 C70,14 12,10 0,0 Z';
    return svg(600, 330, `
      <g transform="translate(70,190) rotate(-9)">
        <path d="${af}" class="fl-surf2 st-fg" stroke-width="2"/>
        ${L(-30, 0, 480, 0, 'st-mut', 1.5, 'stroke-dasharray="6 5"')}
        ${T(220, 32, 'corde', 't-sm t-mut')}
      </g>
      ${A(4, 190, 60, 190, 'cy', 2.5)}${A(4, 230, 60, 230, 'cy', 2.5)}${A(4, 150, 60, 150, 'cy', 2.5)}
      ${T(14, 268, 'vent relatif', 't-sm t-cy', 'start')}
      ${L(70, 190, 530, 190, 'st-cy', 1.2, 'stroke-dasharray="3 4"')}
      <path d="M420,190 A350,350 0 0 0 416,124" class="st-acc" stroke-width="2.5" fill="none"/>
      ${T(442, 165, 'α incidence', 't t-b t-acc', 'start')}
      ${A(250, 140, 250, 40, 'cy', 3.5, 13)}${T(262, 52, 'PORTANCE', 't t-b t-cy', 'start')}
      ${T(262, 69, '⊥ au vent relatif', 't-sm', 'start')}
      ${A(300, 175, 380, 175, 'mut', 3, 11)}${T(388, 180, 'traînée', 't-sm t-mut', 'start')}
      ${T(150, 105, 'EXTRADOS — dépression (aspiration)', 't-sm t-b')}
      ${T(230, 262, 'INTRADOS — surpression', 't-sm t-b')}
      ${T(78, 222, 'bord d’attaque', 't-sm', 'start')}
      ${T(504, 104, 'bord de fuite', 't-sm')}
    `, 'Profil d’aile');
  };

  F.decrochage = () => {
    const x = a => 60 + a * 24, y = c => 280 - c * 150;
    let pts = [];
    for (let a = -2; a <= 15; a += 0.5) pts.push([x(a), y(0.2 + a * 0.087)]);
    const cmax = 0.2 + 15 * 0.087;
    pts.push([x(15.6), y(cmax + 0.02)], [x(16.3), y(cmax - 0.08)], [x(17.5), y(cmax - 0.3)], [x(19), y(cmax - 0.42)], [x(20), y(cmax - 0.46)]);
    const d = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L');
    let ticks = '';
    for (let a = 0; a <= 20; a += 5) ticks += L(x(a), 280, x(a), 286, 'st-mut', 1.5) + T(x(a), 302, a + '°', 't-sm t-mut');
    for (let c = 0; c <= 1.5; c += 0.5) ticks += L(54, y(c), 60, y(c), 'st-mut', 1.5) + T(48, y(c) + 4, c.toFixed(1).replace('.', ','), 't-sm t-mut', 'end');
    return svg(560, 330, `
      <rect x="${x(15.6)}" y="40" width="${x(20.5) - x(15.6)}" height="240" class="fl-bad" opacity=".12"/>
      ${L(60, 40, 60, 280, 'st-mut', 1.5)}${L(60, 280, 560 - 20, 280, 'st-mut', 1.5)}${ticks}
      <path d="${d}" class="st-acc" stroke-width="3.5" fill="none"/>
      <circle cx="${x(15.6)}" cy="${y(cmax + 0.02)}" r="6" class="fl-acc"/>
      ${T(x(15.6) - 8, y(cmax + 0.02) - 16, 'Cz max = DÉCROCHAGE', 't t-b t-acc', 'end')}
      ${T(x(18), 70, 'écoulement', 't-sm t-bad')}${T(x(18), 86, 'décollé', 't-sm t-bad')}
      ${T(x(5), 170, 'zone normale de vol :', 't-sm', 'start')}${T(x(5), 186, 'plus d’incidence = plus de portance', 't-sm', 'start')}
      ${T(300, 325, 'Angle d’incidence α', 't-sm t-b')}
      ${T(18, 30, 'Coefficient de portance Cz', 't-sm t-b', 'start')}
    `, 'Courbe de portance et décrochage');
  };

  F.gouvernes = () => svg(600, 380, `
    <g transform="translate(300,180)">${planeTop()}
      <rect x="-150" y="-6" width="60" height="10" class="fl-acc"/><rect x="90" y="-6" width="60" height="10" class="fl-acc"/>
      <rect x="-85" y="-6" width="65" height="10" class="fl-cy"/><rect x="20" y="-6" width="65" height="10" class="fl-cy"/>
      <rect x="-55" y="104" width="110" height="10" class="fl-ok"/>
      <rect x="18" y="104" width="22" height="10" class="fl-warn"/>
      <rect x="-3" y="96" width="6" height="26" class="fl-fg"/>
    </g>
    ${L(150, 180, 120, 120, 'st-acc', 1.2)}${T(120, 112, 'AILERONS', 't t-b t-acc')}${T(120, 96, 'roulis', 't-sm')}
    ${L(250, 180, 250, 120, 'st-cy', 1.2)}${T(250, 112, 'VOLETS', 't t-b t-cy')}${T(250, 96, 'portance à basse vitesse', 't-sm')}
    ${L(270, 290, 170, 330, 'st-ok', 1.2)}${T(150, 345, 'PROFONDEUR', 't t-b t-ok')}${T(150, 362, 'tangage', 't-sm')}
    ${L(300, 302, 300, 345, 'st-fg', 1.2)}${T(300, 360, 'DIRECTION (dérive)', 't t-b')}${T(300, 376, 'lacet', 't-sm')}
    ${L(330, 290, 460, 330, 'st-warn', 1.2)}${T(490, 345, 'COMPENSATEUR', 't t-b t-warn')}${T(490, 362, 'annule l’effort au manche', 't-sm')}
  `, 'Les gouvernes');

  F.virage = () => {
    const phi = 30;
    const plane = `<g class="fl-surf2 st-fg" stroke-width="1.6">
        <rect x="-150" y="-4" width="300" height="8" rx="3"/><circle cx="0" cy="0" r="16"/>
        <path d="M-6,-16 L0,-46 L6,-16 Z"/><rect x="-50" y="-22" width="100" height="5" rx="2"/></g>`;
    const rows = [[0, '1'], [30, '1,15'], [45, '1,41'], [60, '2'], [75, '3,9']];
    let tbl = rows.map((r, i) => T(450, 98 + i * 24, r[0] + '°', 't-sm', 'end') + T(530, 98 + i * 24, r[1] + ' g', 't-sm t-b', 'end')).join('');
    return svg(580, 330, `
      <g transform="translate(190,175)">
        <g transform="rotate(${phi})">${plane}${A(0, -20, 0, -140, 'cy', 3.5, 13)}</g>
        ${A(0, 20, 0, 120, 'fg', 3.5, 13)}
        ${A(0, 0, (140 * Math.sin(phi * R)).toFixed(1), 0, 'acc', 3.5, 12)}
        ${L(0, 0, 0, -140, 'st-mut', 1, 'stroke-dasharray="4 4"')}
        <path d="M0,-70 A70,70 0 0 1 ${(70 * Math.sin(phi * R)).toFixed(1)},${(-70 * Math.cos(phi * R)).toFixed(1)}" class="st-acc" fill="none" stroke-width="2"/>
        ${T(18, -82, 'φ', 't t-b t-acc')}
      </g>
      ${T(268, 40, 'Portance inclinée', 't-sm t-b t-cy', 'start')}
      ${T(258, 172, 'force centripète', 't-sm t-acc', 'start')}${T(258, 188, '(fait tourner)', 't-sm', 'start')}
      ${T(200, 310, 'Poids', 't-sm t-b', 'start')}
      ${T(490, 50, 'n = 1 / cos φ', 't t-b')}
      ${T(450, 76, 'incl.', 't-sm t-mut', 'end')}${T(530, 76, 'facteur n', 't-sm t-mut', 'end')}${tbl}
      ${T(490, 230, 'À 60° : l’avion « pèse » 2×,', 't-sm')}${T(490, 247, 'la vitesse de décrochage', 't-sm')}${T(490, 264, 'augmente de √2 ≈ +41 %', 't-sm t-b')}
    `, 'Virage et facteur de charge');
  };

  F.puissance = () => {
    const x = v => 60 + (v - 40) * 3.4, y = p => 280 - p * 1.7;
    const pn = v => 3800 / v + 0.00002 * v * v * v;
    const pu = v => 105 - 0.0035 * (v - 135) * (v - 135);
    let d1 = '', d2 = '';
    for (let v = 45; v <= 175; v += 2) {
      d1 += (v === 45 ? 'M' : 'L') + x(v).toFixed(1) + ',' + y(pn(v)).toFixed(1);
      d2 += (v === 45 ? 'M' : 'L') + x(v).toFixed(1) + ',' + y(pu(v)).toFixed(1);
    }
    let vmin = 45, best = 1e9;
    for (let v = 45; v < 175; v += 0.5) if (pn(v) < best) { best = pn(v); vmin = v; }
    return svg(560, 330, `
      <rect x="60" y="30" width="${x(vmin) - 60}" height="250" class="fl-warn" opacity=".12"/>
      ${L(60, 30, 60, 280, 'st-mut', 1.5)}${L(60, 280, 520, 280, 'st-mut', 1.5)}
      <path d="${d1}" class="st-acc" stroke-width="3.5" fill="none"/>
      <path d="${d2}" class="st-cy" stroke-width="3" fill="none" stroke-dasharray="9 5"/>
      ${L(x(vmin), 30, x(vmin), 280, 'st-mut', 1.2, 'stroke-dasharray="4 4"')}
      <circle cx="${x(vmin)}" cy="${y(best)}" r="5" class="fl-acc"/>
      ${T(x(vmin), 300, 'V puissance mini', 't-sm t-b')}
      ${T(68, 50, '2nd RÉGIME', 't-sm t-b t-warn', 'start')}${T(68, 66, 'ralentir demande', 't-sm', 'start')}${T(68, 82, 'PLUS de puissance', 't-sm', 'start')}

  function mk(q, good, bads, extra) {
    const seen = new Set([String(good)]); const ch = [good];
    for (const b of bads) { if (ch.length >= 4) break; if (!seen.has(String(b))) { seen.add(String(b)); ch.push(b); } }

  const alphaHow = 'L’alphabet radiotéléphonique de l’OACI attribue un mot à chaque lettre, choisi pour être compris par des locuteurs de toutes langues, même avec une radio grésillante. Les mots s’écrivent Alfa et Juliett (et non Alpha, Juliet) pour garder la bonne prononciation dans toutes les langues.';

    () => { const w = pick(ALPHA); return mk(`Quel mot correspond à la lettre ${letterOf(w)} ?`, w, shuffle(ALPHA.filter(x => x !== w)), { exp: `${letterOf(w)} se dit « ${w} ».`, how: alphaHow, fig: 'otan', src: SRC_ALPHA }); },
    () => { const w = pick(ALPHA); return mk(`« ${w} » : quelle lettre ?`, letterOf(w), shuffle(ALPHA.filter(x => x !== w)).map(letterOf), { exp: `« ${w} » = ${letterOf(w)}.`, how: alphaHow, fig: 'otan', src: SRC_ALPHA }); },
    () => {
      const reg = 'F-O' + Array.from({ length: 3 }, () => String.fromCharCode(65 + rnd(0, 25))).join('');
      const spell = r => r.replace('-', '').split('').map(c => ALPHA.find(w => w[0] === c)).join(' ');
      const good = spell(reg);
      const pos = shuffle([1, 2, 3, 4]); const bads = [0, 1, 2].map(k => { const parts = good.split(' '); const i = pos[k]; const alt = { Alfa: 'Alpha', Juliett: 'Juliet', Whiskey: 'Whisky', Kilo: 'Kilogramme', Echo: 'Écho', Golf: 'Golfe', Hotel: 'Hôtel', Mike: 'Michel', Oscar: 'Olivier', Papa: 'Pierre', Romeo: 'Robert', Sierra: 'Simon', Tango: 'Thomas', Victor: 'Valérie', Yankee: 'Yvonne', Zulu: 'Zoé', Bravo: 'Bernard', Charlie: 'Charles', Delta: 'David', Foxtrot: 'François', India: 'Irène', Lima: 'Louis', November: 'Nicolas', Quebec: 'Québec', Uniform: 'Ursule', 'X-ray': 'Xavier', Foxtrot2: '' }; parts[i] = alt[parts[i]] || pick(ALPHA); return parts.join(' '); });
      return mk(`Comment épeler l’immatriculation ${reg} à la radio ?`, good, bads, { exp: `${reg} s’épelle : ${good}. Le tiret ne se prononce pas.`, how: 'Les avions immatriculés en France commencent par F ; en outre-mer, comme en Nouvelle-Calédonie, l’immatriculation commence par F-O. À la radio, chaque lettre est épelée avec l’alphabet OACI, jamais avec des prénoms.', fig: 'otan', src: SRC_ALPHA });
    },
    () => { const n = pick(NUMS); return mk(`Comment se prononce le chiffre ${n[0]} à la radio ?`, `${n[1]} (${n[2]})`, shuffle(NUMS.filter(x => x !== n)).map(x => `${x[1]} (${x[2]})`), { exp: `${n[0]} se dit « ${n[1]} », prononcé ${n[2]}.`, how: 'L’OACI fixe une prononciation pour chaque chiffre : 3 = « tree », 4 = « fower », 5 = « fife », 9 = « niner ». Elle évite les confusions (five / nine, nine / nein).', src: SRC_ALPHA }); },
    () => {
      const fl = rnd(5, 39) * 10; const s = String(fl).split('').map(d => NUMS[+d][1]).join(' ');
      const wrong1 = 'Flight level ' + (fl >= 100 ? ['', 'one hundred', 'two hundred', 'three hundred'][Math.floor(fl / 100)] + ' ' + (fl % 100) : String(fl));
      return mk(`Comment annoncer le niveau de vol ${fl} ?`, 'Flight level ' + s, [wrong1, 'Level ' + fl + ' feet', 'Flight level ' + String(fl).split('').reverse().map(d => NUMS[+d][1]).join(' ')], { exp: `On épelle chaque chiffre : Flight level ${s}.`, how: 'Les niveaux de vol, caps, fréquences, QNH et codes transpondeur se disent chiffre par chiffre. Seules les altitudes et hauteurs en centaines ou milliers ronds utilisent « hundred » et « thousand ».', src: SRC_ALPHA });
    }
  ];

  // ---------- Instruments ----------
  const SRC_INS = { label: 'FAA, Pilot’s Handbook of Aeronautical Knowledge (FAA-H-8083-25), ch. 8 « Flight Instruments »' };
  function altimeterSvg(alt) {
    const cx = 110, cy = 110; let s = H.face(cx, cy, 92);
    s += H.ticksDial(cx, cy, 88, 50, 6) + H.ticksDial(cx, cy, 88, 10, 14);
    for (let i = 0; i < 10; i++) { const a = (i * 36 - 90) * R; s += H.T((cx + 64 * Math.cos(a)).toFixed(1), (cy + 64 * Math.sin(a) + 7).toFixed(1), i, 't t-pfg t-b'); }
    s += `<rect x="${cx + 30}" y="${cy - 10}" width="44" height="20" rx="3" fill="#000" stroke="#56677C"/>` + H.T(cx + 52, cy + 5, '1013', 't-xs t-pfg');
    s += H.T(cx, cy + 40, 'ALT · FT ×100', 't-xs t-pfg');
    s += H.needle(cx, cy, (alt % 10000) / 10000 * 360, 46, 'st-pfg', 7) + H.needle(cx, cy, (alt % 1000) / 1000 * 360, 78, 'st-pfg', 3);
    return H.svg(220, 220, s, 'Altimètre');
  }
  function asiSvg(v) {
    const cx = 110, cy = 110, sp = x => (x - 40) * 2.5; let s = `<circle cx="${cx}" cy="${cy}" r="100" class="fl-bezel"/><circle cx="${cx}" cy="${cy}" r="94" class="fl-panel"/>`;
    s += `<path d="${H.arc(cx, cy, 80, sp(50), sp(110))}" class="st-ok" stroke-width="8" fill="none"/><path d="${H.arc(cx, cy, 80, sp(110), sp(150))}" class="st-warn" stroke-width="8" fill="none"/><path d="${H.arc(cx, cy, 70, sp(45), sp(85))}" style="stroke:#f5f7fa" stroke-width="6" fill="none"/>`;
    for (let x = 40; x <= 160; x += 10) { const a = (sp(x) - 90) * R; s += `<line x1="${(cx + 90 * Math.cos(a)).toFixed(1)}" y1="${(cy + 90 * Math.sin(a)).toFixed(1)}" x2="${(cx + (x % 20 ? 84 : 80) * Math.cos(a)).toFixed(1)}" y2="${(cy + (x % 20 ? 84 : 80) * Math.sin(a)).toFixed(1)}" class="st-pfg" stroke-width="2"/>`; if (x % 20 === 0) s += H.T((cx + 56 * Math.cos(a)).toFixed(1), (cy + 56 * Math.sin(a) + 5).toFixed(1), x, 't-sm t-pfg t-b'); }
    const r1 = (sp(150) - 90) * R; s += `<line x1="${cx + 72 * Math.cos(r1)}" y1="${cy + 72 * Math.sin(r1)}" x2="${cx + 92 * Math.cos(r1)}" y2="${cy + 92 * Math.sin(r1)}" class="st-bad" stroke-width="5"/>`;
    s += H.needle(cx, cy, sp(v), 76, 'st-pfg', 3.5) + H.T(cx, cy + 36, 'KT', 't-xs t-pfg');
    return H.svg(220, 220, s, 'Anémomètre');
  }
  function hdgSvg(h) {
    const cx = 110, cy = 110; let s = H.face(cx, cy, 92) + `<g transform="rotate(${-h} ${cx} ${cy})">`;
    for (let a = 0; a < 360; a += 5) { const ra = (a - 90) * R, l = a % 30 === 0 ? 12 : a % 10 === 0 ? 8 : 5; s += `<line x1="${(cx + 88 * Math.cos(ra)).toFixed(1)}" y1="${(cy + 88 * Math.sin(ra)).toFixed(1)}" x2="${(cx + (88 - l) * Math.cos(ra)).toFixed(1)}" y2="${(cy + (88 - l) * Math.sin(ra)).toFixed(1)}" class="st-pfg" stroke-width="1.6"/>`; }
    const lab = { 0: 'N', 90: 'E', 180: 'S', 270: 'W' };
    for (let a = 0; a < 360; a += 30) { const ra = (a - 90) * R, x = cx + 62 * Math.cos(ra), y = cy + 62 * Math.sin(ra); s += `<text x="${x.toFixed(1)}" y="${(y + 6).toFixed(1)}" text-anchor="middle" class="t ${lab[a] ? 't-b' : ''} t-pfg" transform="rotate(${a} ${x.toFixed(1)} ${y.toFixed(1)})">${lab[a] || a / 10}</text>`; }
    s += `</g><polygon points="${cx},${cy - 92} ${cx - 7},${cy - 104} ${cx + 7},${cy - 104}" class="fl-mock"/>`;
    s += `<path d="M${cx},${cy - 26} L${cx},${cy + 26} M${cx - 20},${cy - 4} L${cx + 20},${cy - 4} M${cx - 8},${cy + 20} L${cx + 8},${cy + 20}" class="st-mock" stroke-width="4" stroke-linecap="round"/>`;
    return H.svg(220, 220, s, 'Conservateur de cap');
  }
  function vsiSvg(vs) {
    const cx = 110, cy = 110; let s = H.face(cx, cy, 92);
    const ang = v => 270 + v / 2000 * 170;
    for (let v = -2000; v <= 2000; v += 100) { const a = (ang(v) - 90) * R, l = v % 500 === 0 ? 12 : 6; s += `<line x1="${(cx + 88 * Math.cos(a)).toFixed(1)}" y1="${(cy + 88 * Math.sin(a)).toFixed(1)}" x2="${(cx + (88 - l) * Math.cos(a)).toFixed(1)}" y2="${(cy + (88 - l) * Math.sin(a)).toFixed(1)}" class="st-pfg" stroke-width="2"/>`; if (v % 500 === 0) s += H.T((cx + 64 * Math.cos(a)).toFixed(1), (cy + 64 * Math.sin(a) + 5).toFixed(1), Math.abs(v / 100), 't-sm t-pfg t-b'); }
    s += H.T(cx + 26, cy - 30, 'MONTÉE ↑', 't-xs t-pfg', 'start') + H.T(cx + 26, cy + 38, 'DESCENTE ↓', 't-xs t-pfg', 'start') + H.T(cx + 10, cy + 4, 'ft/min ×100', 't-xs t-pfg', 'start');
    s += H.needle(cx, cy, ang(vs), 80, 'st-pfg', 3.5);
    return H.svg(220, 220, s, 'Variomètre');
  }
  const instruments = [
    () => { const alt = rnd(5, 99) * 100 + pick([0, 0, 50]); const good = nf(alt) + ' ft';
      const th = Math.floor(alt / 1000), hu = alt % 1000;
      const bads = [nf(((Math.floor(hu / 100)) * 1000 + th * 100) % 10000 || 100) + ' ft', nf(alt + 1000) + ' ft', nf(Math.max(100, alt - 1000)) + ' ft', nf(alt + 100) + ' ft'];
      return mk('Quelle altitude indique cet altimètre ?', good, bads, { qfig: altimeterSvg(alt), exp: `La petite aiguille (épaisse) indique les milliers : ${th}. La grande aiguille indique les centaines : ${fr(hu / 100)}. Total : ${good}.`, how: 'Comme une horloge : la petite aiguille avance lentement (1 tour = 10 000 ft), la grande fait un tour complet tous les 1 000 ft. On lit toujours la petite d’abord, puis la grande. Le calage (ici 1013 hPa) se règle dans la fenêtre.', src: SRC_INS }); },
    () => { const v = rnd(5, 15) * 10 + pick([0, 5]); const good = v + ' kt';
      const zone = v < 50 ? 'sous l’arc vert' : v <= 110 ? 'dans l’arc vert (plage normale)' : v <= 150 ? 'dans l’arc jaune (air calme uniquement)' : 'au-delà de la VNE';
      return mk('Quelle vitesse indique cet anémomètre ?', good, [(v + 10) + ' kt', (v - 10) + ' kt', (v + 5) + ' kt', (v - 5) + ' kt'], { qfig: asiSvg(v), exp: `L’aiguille est sur ${v} kt, ${zone}.`, how: 'L’anémomètre mesure la différence entre la pression totale (tube de Pitot) et la pression statique. Les arcs de couleur montrent les plages : blanc pour les volets, vert pour le vol normal, jaune pour l’air calme seulement, trait rouge à ne jamais dépasser.', fig: 'anemo', src: SRC_INS }); },
    () => { const h = rnd(0, 71) * 5; const good = p3(h) + '°';
      return mk('Quel cap indique ce conservateur de cap ?', good, [p3((h + 180) % 360) + '°', p3((h + 10) % 360) + '°', p3((h + 350) % 360) + '°', p3((h + 30) % 360) + '°'], { qfig: hdgSvg(h), exp: `On lit le cap sous l’index orange en haut : ${good}. Les chiffres de la rose sont en dizaines de degrés (12 = 120°).`, how: 'Le conservateur de cap est gyroscopique : il ne subit pas les erreurs du compas en virage, mais il dérive lentement. On le recale sur le compas magnétique en vol stabilisé, environ toutes les 15 minutes.', src: SRC_INS }); },
    () => { const vs = pick([-1, 1]) * rnd(1, 18) * 100; const good = (vs > 0 ? '+' : '−') + nf(Math.abs(vs)) + ' ft/min';
      const opp = (vs > 0 ? '−' : '+') + nf(Math.abs(vs)) + ' ft/min';
      return mk('Que montre ce variomètre ?', good, [opp, (vs > 0 ? '+' : '−') + nf(Math.abs(vs) + 500) + ' ft/min', (vs > 0 ? '+' : '−') + nf(Math.max(100, Math.abs(vs) - 300)) + ' ft/min'], { qfig: vsiSvg(vs), exp: `L’aiguille est ${vs > 0 ? 'au-dessus' : 'au-dessous'} du zéro (à gauche) : ${vs > 0 ? 'montée' : 'descente'} de ${nf(Math.abs(vs))} ft/min.`, how: 'Le variomètre compare la pression statique actuelle à celle d’une petite chambre qui fuit lentement. Il donne la tendance (monte ou descend) avec un léger retard. Le zéro est à 9 heures ; au-dessus c’est la montée.', src: SRC_INS }); },
    () => { const bank = pick([-30, -15, 0, 15, 30]), pitch = pick([-10, 0, 10]);
      const d = (b, p) => (b === 0 ? 'Ailes à plat' : `Virage à ${b > 0 ? 'droite' : 'gauche'}`) + ', ' + (p > 0 ? 'en montée' : p < 0 ? 'en descente' : 'en palier');
      const good = d(bank, pitch);
      const bads = shuffle([d(-bank || 15, pitch), d(bank, -pitch || 10), d(-bank || -15, -pitch || -10), d(bank === 0 ? 30 : 0, pitch)]);
      return mk('Que fait l’avion, d’après cet horizon artificiel ?', good, bads, { qfig: H.svg(220, 220, H.attitude(110, 110, 92, bank, pitch * 1.6, 'cg' + Math.random().toString(36).slice(2, 7)), 'Horizon artificiel'), exp: `${bank === 0 ? 'La ligne d’horizon est horizontale : ailes à plat.' : `La ligne d’horizon monte vers la ${bank > 0 ? 'droite' : 'gauche'} : l’avion est incliné à ${bank > 0 ? 'droite' : 'gauche'}.`} ${pitch > 0 ? 'La maquette orange est au-dessus de l’horizon : nez haut.' : pitch < 0 ? 'La maquette orange est sous l’horizon : nez bas.' : 'La maquette est sur l’horizon : assiette nulle.'}`, how: 'La maquette orange, c’est ton avion : elle ne bouge jamais. C’est l’horizon (ciel bleu, sol marron) qui bouge derrière, comme le vrai horizon à travers le pare-brise. Le petit triangle en haut indique l’inclinaison sur les graduations 10, 20, 30 et 60°.', fig: 'horizon', src: SRC_INS }); }
  ];

  // ---------- Pistes et caps ----------
  const SRC_RWY = { label: 'OACI, Annexe 14, Vol. I, § 5.2.2 (marques d’identification de piste)' };
  const rwyOf = q => { const n = Math.round(q / 10) % 36; return n === 0 ? 36 : n; };
  const pistes = [
    () => { const q = rnd(1, 359); const n = rwyOf(q); return mk(`Une piste orientée au ${p3(q)}° magnétique porte quel numéro ?`, String(n).padStart(2, '0'), [rwyOf(q + 180), rwyOf(q + 10), rwyOf(q + 350), Math.floor(q / 10) || 36].map(x => String(x).padStart(2, '0')), { exp: `${p3(q)}° ÷ 10 = ${fr((q / 10).toFixed(1))}, arrondi à ${n}.`, how: 'Le numéro de piste est l’orientation magnétique divisée par 10 et arrondie à l’entier le plus proche. Une piste orientée au nord porte le numéro 36, jamais 00.', fig: 'pistes', src: SRC_RWY }); },
    () => { const n = rnd(1, 18); const o = n + 18; const [a, b] = pick([[n, o], [o, n]]); return mk(`La piste ${String(a).padStart(2, '0')} a pour autre extrémité la piste… ?`, String(b).padStart(2, '0'), [String((a + 9) % 36 || 36).padStart(2, '0'), String((b + 1) % 36 || 36).padStart(2, '0'), String((b + 35) % 36 || 36).padStart(2, '0')], { exp: `Les deux sens d’une même piste diffèrent de 180°, donc de 18 : ${a} ${a > 18 ? '−' : '+'} 18 = ${b}.`, how: 'Une piste a deux sens d’utilisation, opposés de 180°. On l’appelle par exemple 11/29. On utilise le sens le plus face au vent.', fig: 'pistes', src: SRC_RWY }); },
    () => { const n = rnd(1, 18), o = n + 18; const nd = n * 10, od = o * 10; const useN = Math.random() < .5; const base = useN ? nd : od; const wd = ((base + pick([-50, -40, -30, -20, -10, 0, 10, 20, 30, 40, 50]) + 360) % 360) || 360; const ws = rnd(6, 22);
      const good = String(useN ? n : o).padStart(2, '0'), bad = String(useN ? o : n).padStart(2, '0');
      return mk(`Aérodrome avec piste ${String(n).padStart(2, '0')}/${o}. Vent : ${p3(wd)}° / ${ws} kt. Quelle piste est en service ?`, good, [bad, 'Les deux sont équivalentes', 'Aucune, vent trop fort'], { exp: `Le vent vient du ${p3(wd)}°. La piste ${good} est orientée au ${p3(+good * 10)}° : c’est la plus face au vent (écart de ${Math.min(Math.abs(wd - +good * 10), 360 - Math.abs(wd - +good * 10))}°).`, how: 'On décolle et on atterrit face au vent : la vitesse par rapport au sol est plus faible, donc les distances sont plus courtes. La direction du vent donnée dans un METAR est celle d’où il vient.', fig: 'tdp', src: { label: 'EASA, SERA.3225 et FAA, Airplane Flying Handbook (FAA-H-8083-3), ch. 6' } }); },
    () => { const c = rnd(0, 71) * 5; const g = (c + 180) % 360; return mk(`Quel est le cap inverse de ${p3(c)}° ?`, p3(g) + '°', [p3((c + 90) % 360) + '°', p3((g + 20) % 360) + '°', p3((g + 340) % 360) + '°'], { exp: `${p3(c)} ${c < 180 ? '+' : '−'} 180 = ${p3(g)}.`, how: 'Astuce mentale : si le cap est inférieur à 180, ajoute 200 puis retire 20 ; sinon retire 200 puis ajoute 20. Exemple : 070 + 200 − 20 = 250.', src: { label: 'FAA, PHAK (FAA-H-8083-25), ch. 16 « Navigation »' } }); },
    () => { const cv = rnd(1, 71) * 5, d = rnd(2, 14), e = Math.random() < .5; const cm = (cv + (e ? -d : d) + 360) % 360;
      return mk(`Route vraie ${p3(cv)}°, déclinaison magnétique ${d}° ${e ? 'Est' : 'Ouest'}. Route magnétique ?`, p3(cm) + '°', [p3((cv + (e ? d : -d) + 360) % 360) + '°', p3(cv) + '°', p3((cm + 180) % 360) + '°'], { exp: `Déclinaison ${e ? 'Est : on la retranche' : 'Ouest : on l’ajoute'}. ${p3(cv)} ${e ? '−' : '+'} ${d} = ${p3(cm)}°.`, how: 'Le nord magnétique (celui du compas) n’est pas le nord géographique des cartes. L’écart s’appelle la déclinaison. Moyen mnémotechnique anglo-saxon : « East is least, West is best » (Est on retranche, Ouest on ajoute) pour passer du vrai au magnétique.', fig: 'vent', src: { label: 'FAA, PHAK (FAA-H-8083-25), ch. 16 « Variation »' } }); }
  ];

  // ---------- Vent ----------
  const vent = [
    () => { const n = rnd(1, 36), ang = pick([10, 20, 30, 45, 60, 90]), side = pick([-1, 1]), ws = pick([8, 10, 12, 15, 18, 20, 24, 30]);
      const wd = ((n * 10 + side * ang + 360) % 360) || 360; const xw = Math.round(ws * Math.sin(ang * R));
      return mk(`Piste ${String(n).padStart(2, '0')}, vent ${p3(wd)}° / ${ws} kt. Composante de vent traversier ?`, xw + ' kt', [ws + ' kt', Math.round(ws * Math.cos(ang * R)) + ' kt', Math.max(1, xw + pick([-4, 4, 6])) + ' kt', Math.round(ws / 2) + ' kt'], { exp: `L’angle entre le vent et la piste est ${ang}°. Travers = ${ws} × sin ${ang}° ≈ ${ws} × ${fr(Math.sin(ang * R).toFixed(2))} ≈ ${xw} kt.`, how: 'On sépare le vent en deux : une partie dans l’axe (vent de face) et une partie de côté (vent de travers). Règle rapide : 30° → la moitié du vent, 45° → 0,7, 60° et plus → presque tout le vent. Chaque avion a un vent de travers maximal démontré dans son manuel de vol.', fig: 'traversier', src: { label: 'FAA, Airplane Flying Handbook (FAA-H-8083-3), ch. 8 « Crosswind » ; FAA, PHAK, ch. 11' } }); },
    () => { const n = rnd(1, 36), ang = pick([0, 20, 30, 45, 60]), side = pick([-1, 1]), ws = pick([10, 12, 15, 20, 25]);
      const wd = ((n * 10 + side * ang + 360) % 360) || 360; const hw = Math.round(ws * Math.cos(ang * R));
      return mk(`Piste ${String(n).padStart(2, '0')}, vent ${p3(wd)}° / ${ws} kt. Composante de vent de face ?`, hw + ' kt', [ws + ' kt', Math.round(ws * Math.sin(ang * R)) + ' kt', Math.max(0, hw - 5) + ' kt', (hw + 4) + ' kt'], { exp: `Vent de face = ${ws} × cos ${ang}° ≈ ${hw} kt.`, how: 'Le vent de face réduit la vitesse sol, donc les distances de décollage et d’atterrissage. C’est pour cela qu’on choisit la piste la plus face au vent.', fig: 'traversier', src: { label: 'FAA, PHAK (FAA-H-8083-25), ch. 11 « Aircraft Performance »' } }); }
  ];

  // ---------- METAR ----------
  const SRC_MET = { label: 'OMM, Manuel des codes (WMO-No. 306), FM 15 METAR ; Météo-France, guide aviation' };
  const STA = [['NWWW', 'Nouméa La Tontouta'], ['NWWM', 'Nouméa Magenta'], ['NWWL', 'Lifou'], ['LFPG', 'Paris-Charles-de-Gaulle'], ['LFBO', 'Toulouse-Blagnac'], ['YSSY', 'Sydney'], ['NZAA', 'Auckland']];
  const WX = [['-RA', 'pluie faible'], ['RA', 'pluie modérée'], ['+RA', 'forte pluie'], ['SHRA', 'averses de pluie'], ['TSRA', 'orage avec pluie'], ['BR', 'brume'], ['DZ', 'bruine']];
  const COV = { FEW: '1 à 2 octas (quelques nuages)', SCT: '3 à 4 octas (épars)', BKN: '5 à 7 octas (fragmenté)', OVC: '8 octas (couvert)' };
  function genMetar() {
    const st = pick(STA), day = rnd(1, 28), hh = rnd(0, 23), mm = pick(['00', '30']);
    const vrb = Math.random() < .1; const wd = rnd(1, 36) * 10, ws = vrb ? rnd(1, 3) : rnd(4, 28), gust = !vrb && ws > 14 && Math.random() < .4 ? ws + rnd(8, 15) : null;
    const cavok = Math.random() < .2;
    const vis = cavok ? 9999 : pick([9999, 9999, 8000, 6000, 4000, 3000, 1500]);
    const wx = cavok || (vis === 9999 && Math.random() < .6) ? null : vis < 5000 ? pick(WX) : pick(WX.slice(0, 5));
    let clouds = [];
    if (!cavok) { let h = rnd(3, 25); const n = rnd(1, 3); const types = ['FEW', 'SCT', 'BKN', 'OVC']; let ti = rnd(0, 1); for (let i = 0; i < n; i++) { clouds.push([types[Math.min(ti, 3)], h, wx && wx[0] === 'TSRA' && i === 0 ? 'CB' : '']); h += rnd(5, 25); ti += rnd(0, 2); if (types[Math.min(ti - 1, 3)] === 'OVC') break; } }
    const t = rnd(12, 31), td = t - rnd(0, 12), q = rnd(998, 1028);
    const parts = ['METAR', st[0], `${String(day).padStart(2, '0')}${String(hh).padStart(2, '0')}${mm}Z`, vrb ? `VRB${String(ws).padStart(2, '0')}KT` : `${p3(wd)}${String(ws).padStart(2, '0')}${gust ? 'G' + gust : ''}KT`];
    if (cavok) parts.push('CAVOK'); else { parts.push(String(vis).padStart(4, '0')); if (wx) parts.push(wx[0]); clouds.forEach(c => parts.push(c[0] + p3(c[1]) + c[2])); }
    parts.push(`${String(t).padStart(2, '0')}/${String(td).padStart(2, '0')}`, `Q${q}`);
    return { txt: parts.join(' ') + '=', st, day, hh, mm, vrb, wd, ws, gust, cavok, vis, wx, clouds, t, td, q };
  }
  const metarBox = m => `<div class="metar-line" style="width:100%">${m.txt}</div>`;
  const metarHow = 'Un METAR se lit toujours dans le même ordre : type, code OACI de l’aérodrome, jour et heure UTC, vent (direction d’où il vient en degrés vrais, puis force en nœuds), visibilité en mètres (9999 = 10 km ou plus), temps présent, nuages (quantité en octas + hauteur en centaines de pieds), température / point de rosée, QNH.';
  const metarQs = [
    m => m.vrb ? mk('Que signifie le vent indiqué ?', 'Vent variable, faible (' + m.ws + ' kt)', ['Vent du nord, ' + m.ws + ' kt', 'Rafales de ' + m.ws + ' kt', 'Vent nul'], {}) : mk('D’où vient le vent et quelle est sa force ?', `Du ${p3(m.wd)}°, ${m.ws} kt`, [`Vers le ${p3(m.wd)}°, ${m.ws} kt`, `Du ${p3((m.wd + 180) % 360 || 360)}°, ${m.ws} kt`, `Du ${p3(m.wd)}°, ${m.ws} km/h`], { exp: `Groupe vent : ${p3(m.wd)} = direction d’où vient le vent, ${m.ws} = vitesse en nœuds (KT).` }),
    m => m.cavok ? mk('Que signifie CAVOK ?', 'Visibilité ≥ 10 km, pas de nuage significatif sous 5 000 ft, pas de phénomène', ['Ciel couvert', 'Visibilité nulle', 'Piste fermée'], { exp: 'CAVOK = Ceiling And Visibility OK : visibilité 10 km ou plus, aucun nuage sous 5 000 ft (ou sous l’altitude minimale de secteur la plus élevée si elle est plus haute), aucun cumulonimbus, aucun phénomène significatif.' })
      : mk('Quelle est la visibilité ?', m.vis === 9999 ? '10 km ou plus' : nf(m.vis) + ' m', m.vis === 9999 ? ['9 999 m exactement', '99 km', '1 km'] : [nf(m.vis * 10) + ' m', fr(m.vis / 100) + ' km', nf(m.vis) + ' ft'], { exp: m.vis === 9999 ? '9999 est un code : il signifie 10 km ou plus.' : `La visibilité est donnée en mètres : ${m.vis} m.` }),
    m => { const ceil = m.clouds.find(c => c[0] === 'BKN' || c[0] === 'OVC'); const good = ceil ? nf(ceil[1] * 100) + ' ft' : 'Pas de plafond';
      return mk('Quelle est la hauteur du plafond (première couche BKN ou OVC) ?', good, ceil ? [nf(ceil[1]) + ' ft', nf(ceil[1] * 1000) + ' ft', 'Pas de plafond', ...m.clouds.filter(c => c !== ceil).map(c => nf(c[1] * 100) + ' ft')] : [nf((m.clouds[0] ? m.clouds[0][1] : 30) * 100) + ' ft', '1 000 ft', '5 000 ft'], { exp: ceil ? `Le plafond est la première couche fragmentée (BKN) ou couverte (OVC) : ${ceil[0]}${p3(ceil[1])} = ${nf(ceil[1] * 100)} ft au-dessus de l’aérodrome.` : 'Aucune couche BKN ou OVC : il n’y a pas de plafond (FEW et SCT n’en forment pas).' }); },
    m => mk('Quelle est la température et le point de rosée ?', `${m.t} °C / ${m.td} °C`, [`${m.td} °C / ${m.t} °C`, `${m.t} °F / ${m.td} °F`, `${m.t} °C / humidité ${m.td} %`], { exp: `${m.t}/${m.td} : température ${m.t} °C, point de rosée ${m.td} °C. Plus ils sont proches, plus l’air est humide (risque de brume ou de brouillard).` }),
    m => mk('Quel est le QNH ?', m.q + ' hPa', [(m.q - 10) + ' hPa', '1013 hPa', m.q + ' inHg'], { exp: `Q${m.q} : QNH ${m.q} hPa. On l’affiche à l’altimètre pour lire l’altitude au-dessus du niveau de la mer.`, fig: 'calage' }),
    m => mk('À quelle heure UTC ce METAR a-t-il été émis ?', `Le ${m.day} à ${String(m.hh).padStart(2, '0')}h${m.mm} UTC`, [`Le ${m.day} à ${String((m.hh + 11) % 24).padStart(2, '0')}h${m.mm} UTC`, `Le ${String(m.hh).padStart(2, '0')} à ${m.day}h${m.mm} UTC`, `Le ${m.day} à ${String(m.hh).padStart(2, '0')}h${m.mm} heure locale`], { exp: `${String(m.day).padStart(2, '0')}${String(m.hh).padStart(2, '0')}${m.mm}Z : jour ${m.day}, ${String(m.hh).padStart(2, '0')}h${m.mm}, Z = UTC. En Nouvelle-Calédonie, l’heure locale est UTC + 11 : ${String((m.hh + 11) % 24).padStart(2, '0')}h${m.mm}.` }),
    m => m.gust ? mk('Que signifie « G' + m.gust + ' » dans le groupe vent ?', `Rafales jusqu’à ${m.gust} kt`, [`Vent moyen ${m.gust} kt`, `Vent variable sur ${m.gust}°`, `Visibilité ${m.gust} km`], { exp: `G = gust (rafale). Vent moyen ${m.ws} kt avec des rafales à ${m.gust} kt.` }) : null,
    m => m.wx ? mk(`Que signifie le code « ${m.wx[0]} » ?`, m.wx[1], shuffle(WX.filter(w => w !== m.wx)).map(w => w[1]), { exp: `${m.wx[0]} = ${m.wx[1]}. Le signe − veut dire faible, + fort ; SH = averse, TS = orage, RA = pluie, BR = brume, DZ = bruine.` }) : null,

  ];
  const metar = [() => { const m = genMetar(); let q = null; while (!q) q = pick(metarQs)(m); return Object.assign(q, { qfig: metarBox(m), how: metarHow, fig: 'metar', src: SRC_MET }); }];

  const SRC_U = { label: 'OACI, Annexe 5 « Unités de mesure à utiliser dans l’exploitation en vol et au sol »' };
  const unites = [
    () => { const ft = rnd(1, 40) * 500; const m = Math.round(ft * 0.3048); return mk(`${nf(ft)} ft, c’est environ combien de mètres ?`, nf(m) + ' m', [nf(Math.round(ft / 0.3048)) + ' m', nf(Math.round(ft * 0.5)) + ' m', nf(Math.round(ft * 0.2)) + ' m'], { exp: `1 ft = 0,3048 m. ${nf(ft)} × 0,3048 ≈ ${nf(m)} m. Calcul mental : diviser par 3 et retirer 10 %.`, how: 'En aviation, les hauteurs et altitudes sont en pieds (ft), les distances en milles nautiques (NM) et les vitesses en nœuds (kt), conformément à l’Annexe 5 de l’OACI.', src: SRC_U }); },
    () => { const nm = rnd(2, 60) * 5; const km = Math.round(nm * 1.852); return mk(`${nm} NM, c’est environ combien de kilomètres ?`, nf(km) + ' km', [nf(Math.round(nm * 1.609)) + ' km', nf(nm) + ' km', nf(Math.round(nm / 1.852)) + ' km'], { exp: `1 NM = 1 852 m. ${nm} × 1,852 ≈ ${km} km.`, how: 'Le mille nautique correspond à une minute d’arc de latitude : c’est pour cela qu’il est pratique sur les cartes. Le mille terrestre (1 609 m) n’est pas utilisé en navigation aérienne.', src: SRC_U }); },
    () => { const kt = rnd(4, 30) * 10; const kmh = Math.round(kt * 1.852); return mk(`${kt} kt, c’est environ combien de km/h ?`, nf(kmh) + ' km/h', [nf(kt) + ' km/h', nf(Math.round(kt * 1.609)) + ' km/h', nf(Math.round(kt / 1.852)) + ' km/h'], { exp: `1 nœud = 1 NM par heure = 1,852 km/h. ${kt} × 1,852 ≈ ${kmh} km/h.`, how: 'Un nœud est une vitesse : un mille nautique par heure. Ne dis jamais « nœuds par heure ».', src: SRC_U }); },
    () => { const h = rnd(0, 23); const l = (h + 11) % 24; return mk(`Il est ${String(h).padStart(2, '0')}:00 UTC. Quelle heure est-il à Nouméa ?`, String(l).padStart(2, '0') + ':00', [String((h + 10) % 24).padStart(2, '0') + ':00', String((h + 13) % 24).padStart(2, '0') + ':00', String((h + 24 - 11) % 24).padStart(2, '0') + ':00'], { exp: `La Nouvelle-Calédonie est à UTC + 11 toute l’année : ${String(h).padStart(2, '0')} + 11 = ${String(l).padStart(2, '0')}:00${h + 11 >= 24 ? ' (le lendemain)' : ''}.`, how: 'Tous les horaires aéronautiques (plans de vol, METAR, NOTAM) sont en UTC, aussi appelé « Zulu » (Z), pour que tout le monde parle de la même heure partout dans le monde.', src: { label: 'OACI, Annexe 5, ch. 3 et Annexe 2' } }); },
    () => { const fl = rnd(2, 40) * 10; return mk(`Le niveau de vol FL ${p3(fl)} correspond à quelle altitude-pression ?`, nf(fl * 100) + ' ft', [nf(fl * 10) + ' ft', nf(fl * 1000) + ' ft', nf(Math.round(fl * 100 * 0.3048)) + ' ft'], { exp: `Niveau de vol = altitude-pression en centaines de pieds : FL ${p3(fl)} = ${nf(fl * 100)} ft avec le calage standard 1013,25 hPa.`, how: 'Au-dessus de l’altitude de transition, tous les avions affichent le même calage (1013,25 hPa). Ainsi, même si la pression réelle change, deux avions à des niveaux différents restent bien séparés.', fig: 'calage', src: { label: 'OACI, Annexe 2 et Doc 8168 (PANS-OPS), Vol. I, partie III' } }); }

        id: 'fdm-1', title: 'L’alphabet et les chiffres de l’aviation', domain: 'com', duration: 20, verified: false,
        intro: 'Avant de toucher un avion, il faut savoir épeler et compter comme un pilote. C’est la première chose qu’on apprend en école.',
        sections: [
          { h: 'Pourquoi un alphabet spécial ?', html: '<p>À la radio, le son est souvent mauvais : grésillements, bruit du moteur, accents différents. Les lettres seules se confondent facilement : <strong>B, D, P, T, V</strong> se ressemblent à l’oreille. L’OACI (Organisation de l’aviation civile internationale) a donc choisi <strong>un mot par lettre</strong>, compréhensible par tout le monde.</p><p>Cet alphabet est obligatoire dans toutes les communications aéronautiques du monde, en anglais comme en français.</p>', fig: 'otan', caption: 'Les 26 mots de l’alphabet OACI.', src: S_ALPHA },
          { h: 'Le tableau complet, avec la prononciation', html: alphaTable + '<p>Attention à l’orthographe officielle : <strong>Alfa</strong> (pas Alpha) et <strong>Juliett</strong> (avec deux t). Elle a été choisie pour que les francophones et les hispanophones prononcent correctement.</p>', tip: 'Apprends-le par paquets de 5 lettres, puis épelle tout ce que tu vois dans la journée : les plaques d’immatriculation, ton prénom, les noms de rue. En une semaine, c’est automatique.', src: S_ALPHA },
          { h: 'Les chiffres', html: '<table class="tbl"><thead><tr><th>Chiffre</th><th>Mot</th><th>Prononciation</th></tr></thead><tbody><tr><td>0</td><td>Zero</td><td><code>ZI-RO</code></td></tr><tr><td>1</td><td>One</td><td><code>OUANN</code></td></tr><tr><td>2</td><td>Two</td><td><code>TOU</code></td></tr><tr><td>3</td><td>Three</td><td><code>TRI</code> (« tree »)</td></tr><tr><td>4</td><td>Four</td><td><code>FO-eur</code> (« fower »)</td></tr><tr><td>5</td><td>Five</td><td><code>FA-IF</code> (« fife »)</td></tr><tr><td>6</td><td>Six</td><td><code>SIKS</code></td></tr><tr><td>7</td><td>Seven</td><td><code>SÈ-VEN</code></td></tr><tr><td>8</td><td>Eight</td><td><code>EIT</code> (« ait »)</td></tr><tr><td>9</td><td>Nine</td><td><code>NAÏ-NEU</code> (« niner »)</td></tr></tbody></table><p>Le 9 se dit <em>niner</em> pour ne pas être confondu avec le 5 ni avec « nein » (non en allemand). La virgule des fréquences se dit <em>decimal</em> (« day-see-mal »).</p>', src: S_ALPHA },
          { h: 'Comment on assemble : immatriculations, caps, fréquences', html: '<ul><li><strong>Immatriculation</strong> : chaque lettre est épelée. Un avion français commence par F ; en outre-mer (Nouvelle-Calédonie, Polynésie…), par <strong>F-O</strong>. Exemple : F-OABC se dit « Foxtrot Oscar Alfa Bravo Charlie ».</li><li><strong>Caps, niveaux de vol, codes transpondeur, QNH</strong> : chiffre par chiffre. Cap 270 = « two seven zero » ; QNH 1013 = « one zero one tree ».</li><li><strong>Fréquences</strong> : chiffre par chiffre avec <em>decimal</em> : 118,1 = « one one eight decimal one ».</li><li><strong>Altitudes rondes</strong> : on utilise <em>hundred</em> et <em>thousand</em> : 2 500 ft = « two thousand five hundred feet ».</li></ul>', tip: 'À l’oral, l’heure se dit aussi chiffre par chiffre, en UTC : 14h30 = « one four three zero ».', src: S_ALPHA }
        ],
