<title>Objectif Pilote de Ligne</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Concept : un carnet de vol façon cockpit. Routes actives en magenta (comme sur un écran de navigation), valeurs sélectionnées en cyan, instruments sur fond noir. */
:root {
  --bg: #EDF1F5; --surf: #FFFFFF; --surf2: #E1E7EE; --fg: #0F1B2D; --muted: #56677C; --line: #CAD3DE;
  --magenta: #A8127A; --cyan: #08789C; --ok: #1C7D47; --warn: #A66A0C; --bad: #BE2F2F;
  --sky: #3E86C4; --ground: #8E6239; --panel: #151C27; --panel-fg: #F2F5F8; --bezel: #39424F; --mock: #F29A1F;
  --cloud: #FFFFFF; --dark: #8C97A6; --cheese: #F3D27A;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A111C; --surf: #111B2A; --surf2: #1A2739; --fg: #E3EBF4; --muted: #92A3B9; --line: #283850;
  --magenta: #F065C4; --cyan: #4DC6EC; --ok: #4CC17E; --warn: #E8B54A; --bad: #FF7D7D;
  --sky: #2D6CA3; --ground: #76502D; --panel: #05080D; --panel-fg: #EDF2F7; --bezel: #2E3744; --mock: #F29A1F;
  --cloud: #2A3A50; --dark: #5A6880; --cheese: #8E7430; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0A111C; --surf: #111B2A; --surf2: #1A2739; --fg: #E3EBF4; --muted: #92A3B9; --line: #283850;
  --magenta: #F065C4; --cyan: #4DC6EC; --ok: #4CC17E; --warn: #E8B54A; --bad: #FF7D7D;
  --sky: #2D6CA3; --ground: #76502D; --panel: #05080D; --panel-fg: #EDF2F7; --bezel: #2E3744; --mock: #F29A1F;
  --cloud: #2A3A50; --dark: #5A6880; --cheese: #8E7430; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.55; margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 5vw, 2.9rem); }
h2 { font-size: 1.75rem; }
h3 { font-size: 1.3rem; }
a { color: var(--cyan); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--panel); color: var(--panel-fg); border-bottom: 2px solid var(--magenta); }
.top-in { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: inherit; }
.brand b { font-family: var(--f-display); font-size: 1.45rem; letter-spacing: .04em; text-transform: uppercase; }
.brand span { font-family: var(--f-mono); font-size: .72rem; color: #9FB0C4; }
.top nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
@media (max-width: 700px) { .top nav { flex-wrap: nowrap; overflow-x: auto; margin-left: 0; flex-basis: 100%; scrollbar-width: none; } .top nav a { white-space: nowrap; } .brand span { display: none; } }
.top nav a { color: #C9D5E2; text-decoration: none; font-family: var(--f-mono); font-size: .8rem; padding: 6px 10px; border-radius: 6px; letter-spacing: .04em; }
.top nav a:hover { background: #ffffff14; }
.top nav a.on { background: #ffffff1c; color: #fff; box-shadow: inset 0 -2px 0 var(--magenta); }
.topbar { flex-basis: 100%; display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: .74rem; color: #9FB0C4; }
.topbar .bar { flex: 1; height: 6px; background: #ffffff1a; border-radius: 3px; overflow: hidden; }
.topbar .bar i { display: block; height: 100%; background: #F065C4; border-radius: 3px; transition: width .6s; }

main { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.view { display: grid; gap: 28px; }
.crumbs { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surf); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--fg); min-height: 44px; }
.btn:hover { border-color: var(--cyan); }
.btn.pri { background: var(--magenta); border-color: var(--magenta); color: #fff; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }

.card { background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }

.pbar { height: 8px; background: var(--surf2); border-radius: 4px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--magenta); border-radius: 4px; transition: width .6s; }
.pbar.cy i { background: var(--cyan); }

/* Tableau de bord */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: center; }
.hero p { max-width: 62ch; color: var(--muted); margin: 10px 0 0; }
.gauge { width: 210px; max-width: 100%; }
.gauge text { font-family: var(--f-mono); }
@media (max-width: 640px) { .hero { grid-template-columns: 1fr; } .gauge { margin: 0 auto; } }

.stage { display: grid; gap: 12px; text-decoration: none; color: inherit; position: relative; }
.stage:hover { border-color: var(--magenta); }
.stage .code { font-family: var(--f-display); font-size: 2.3rem; font-weight: 700; line-height: 1; }
.stage .meta { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.stage p { margin: 0; color: var(--muted); font-size: .92rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.mut { color: var(--muted); } .pill.cy { color: var(--cyan); } .pill.mag { color: var(--magenta); }

.next { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; border-left: 4px solid var(--magenta); }
@media (max-width: 560px) { .next { grid-template-columns: 1fr; } }

.skills { display: grid; gap: 12px; }
.skill { display: grid; grid-template-columns: 170px minmax(0, 1fr) 84px; gap: 12px; align-items: center; font-size: .92rem; }
.skill .v { font-family: var(--f-mono); text-align: right; font-size: .8rem; white-space: nowrap; }
.skill .v.na { color: var(--muted); }
@media (max-width: 520px) { .skill { grid-template-columns: 1fr 84px; } .skill .pbar { grid-column: 1 / -1; grid-row: 2; } }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat b { display: block; font-family: var(--f-mono); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--muted); }

/* Étape */
.mods { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mod { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.mod .n { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; border: 2px solid var(--line); }
.mod.done .n { background: var(--ok); border-color: var(--ok); color: #fff; }
.mod.prog .n { border-color: var(--magenta); color: var(--magenta); }
.mod h3 { font-size: 1.2rem; }
.mod .sub { font-size: .85rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.mod .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 640px) { .mod { grid-template-columns: 44px minmax(0, 1fr); } .mod .acts { grid-column: 1 / -1; justify-content: flex-start; } }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.facts div { border-top: 2px solid var(--cyan); padding-top: 8px; }
.facts b { display: block; font-family: var(--f-mono); font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }

/* Cours */
.lesson { max-width: 820px; display: grid; gap: 26px; }
.lesson .intro { font-size: 1.12rem; color: var(--muted); max-width: 65ch; margin: 8px 0 0; }
.sec { display: grid; gap: 12px; }
.sec h2 { font-size: 1.6rem; display: flex; gap: 12px; align-items: baseline; }
.sec h2 .k { font-family: var(--f-mono); font-size: .85rem; color: var(--magenta); font-weight: 500; }
.prose { max-width: 68ch; }
.prose p { margin: 0 0 .8em; }
.prose ul, .prose ol { margin: 0 0 .8em; padding-left: 1.3em; display: grid; gap: .35em; }
.prose code { font-family: var(--f-mono); background: var(--surf2); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
.tblwrap { overflow-x: auto; }
.tbl { border-collapse: collapse; width: 100%; font-size: .93rem; margin: 0 0 .8em; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-family: var(--f-mono); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; }
figure { margin: 0; background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; overflow-x: auto; }
figure figcaption { font-size: .85rem; color: var(--muted); margin-top: 8px; }
.tip { border: 1px dashed var(--cyan); border-radius: var(--r); padding: 12px 14px; font-size: .95rem; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.tip b { font-family: var(--f-mono); font-size: .72rem; color: var(--cyan); letter-spacing: .1em; text-transform: uppercase; padding-top: 3px; }
.keys { background: var(--panel); color: var(--panel-fg); border-radius: var(--r); padding: 20px 22px; }
.keys h3 { color: #fff; margin-bottom: 10px; }
.keys ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.keys li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; }
.keys li::before { content: "✓"; color: #4CC17E; font-weight: 700; }
.links { display: grid; gap: 6px; }
.links a { font-size: .95rem; }

/* Schémas */
svg.fig { width: 100%; height: auto; display: block; margin: 0 auto; overflow: visible; }
svg.fig text { font-family: var(--f-mono); fill: var(--fg); font-size: 13px; }
svg.fig .t { font-size: 14px; } svg.fig .t-sm { font-size: 12.5px; } svg.fig .t-xs { font-size: 11px; }
svg.fig .t-b { font-weight: 600; } svg.fig .t-big { font-size: 34px; font-weight: 700; font-family: var(--f-display); }
svg.fig .t-mut { fill: var(--muted); } svg.fig .t-acc { fill: var(--magenta); } svg.fig .t-cy { fill: var(--cyan); }
svg.fig .t-ok { fill: var(--ok); } svg.fig .t-warn { fill: var(--warn); } svg.fig .t-bad { fill: var(--bad); } svg.fig .t-pfg { fill: var(--panel-fg); }
svg.fig .t-run { font-family: var(--f-display); font-size: 34px; font-weight: 700; fill: #f5f7fa; }
svg.fig line, svg.fig path, svg.fig polygon, svg.fig rect, svg.fig circle, svg.fig ellipse { stroke-linecap: round; }
.st-fg { stroke: var(--fg); } .st-mut { stroke: var(--muted); } .st-acc { stroke: var(--magenta); } .st-cy { stroke: var(--cyan); }
.st-ok { stroke: var(--ok); } .st-warn { stroke: var(--warn); } .st-bad { stroke: var(--bad); } .st-pfg { stroke: var(--panel-fg); } .st-mock { stroke: var(--mock); }
.fl-fg { fill: var(--fg); } .fl-mut { fill: var(--muted); } .fl-acc { fill: var(--magenta); } .fl-cy { fill: var(--cyan); }
.fl-ok { fill: var(--ok); } .fl-warn { fill: var(--warn); } .fl-bad { fill: var(--bad); } .fl-pfg { fill: var(--panel-fg); } .fl-mock { fill: var(--mock); }
.fl-bg { fill: var(--bg); } .fl-surf { fill: var(--surf); } .fl-surf2 { fill: var(--surf2); } .fl-panel { fill: var(--panel); } .fl-bezel { fill: var(--bezel); }
.fl-sky { fill: var(--sky); } .fl-ground { fill: var(--ground); } .fl-cloud { fill: var(--cloud); } .fl-dark { fill: var(--dark); } .fl-cheese { fill: var(--cheese); }
.metar { display: grid; gap: 14px; }
.metar-line { font-family: var(--f-mono); font-size: 1.05rem; background: var(--panel); color: var(--panel-fg); padding: 12px 14px; border-radius: 8px; line-height: 2; }
.metar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 16px; font-size: .9rem; }
.metar-grid div { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.metar-note { font-size: .8rem; color: var(--muted); margin: 0; }
.mt { font-family: var(--f-mono); font-weight: 600; border-bottom: 3px solid; padding: 0 2px; }
.mt-acc { border-color: var(--magenta); } .mt-cy { border-color: var(--cyan); } .mt-ok { border-color: var(--ok); } .mt-warn { border-color: var(--warn); } .mt-mut { border-color: var(--muted); }
.metar-line .mt-acc { border-color: #F065C4; } .metar-line .mt-cy { border-color: #4DC6EC; } .metar-line .mt-ok { border-color: #4CC17E; } .metar-line .mt-warn { border-color: #E8B54A; } .metar-line .mt-mut { border-color: #92A3B9; }
.otan { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.otan div { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; background: var(--surf2); border-radius: 6px; }
.otan b { font-family: var(--f-display); font-size: 1.3rem; color: var(--magenta); width: 16px; }
.otan span { font-family: var(--f-mono); font-size: .85rem; }
.route { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; counter-reset: r; }
.route li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; background: var(--surf2); border-radius: 8px; padding: 10px; }
.route-n { width: 34px; height: 34px; border-radius: 50%; background: var(--magenta); color: #fff; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; }
.route strong { display: block; font-family: var(--f-display); font-size: 1.15rem; }
.route div span { display: block; font-size: .85rem; }
.route em { display: block; font-family: var(--f-mono); font-size: .74rem; color: var(--muted); font-style: normal; margin-top: 2px; }

/* Quiz */
.quiz { max-width: 780px; display: grid; gap: 20px; }
.qsteps { display: flex; gap: 4px; }
.qsteps i { flex: 1; height: 6px; border-radius: 3px; background: var(--surf2); }
.qsteps i.ok { background: var(--ok); } .qsteps i.ko { background: var(--bad); } .qsteps i.cur { background: var(--cyan); }
.qhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--f-mono); font-size: .82rem; color: var(--muted); }
.qtext { font-size: 1.3rem; font-weight: 600; line-height: 1.4; margin: 0; }
.choices { display: grid; gap: 10px; }
.choice { display: grid; grid-template-columns: 34px minmax(0, 1fr) 24px; gap: 12px; align-items: center; text-align: left; background: var(--surf); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 14px; cursor: pointer; min-height: 56px; }
.choice:hover:not(:disabled) { border-color: var(--cyan); }
.choice .l { width: 34px; height: 34px; border-radius: 8px; background: var(--surf2); display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; }
.choice:disabled { cursor: default; }
.choice.good { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--surf)); }
.choice.good .l { background: var(--ok); color: #fff; }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surf)); }
.choice.wrong .l { background: var(--bad); color: #fff; }
.choice .mk { font-weight: 700; font-size: 1.1rem; }
.choice.good .mk { color: var(--ok); } .choice.wrong .mk { color: var(--bad); }
.fb { border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; border: 1.5px solid; }
.fb.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 7%, var(--surf)); }
.fb.ko { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 6%, var(--surf)); }
.fb h3 { font-size: 1.3rem; }
.fb.ok h3 { color: var(--ok); } .fb.ko h3 { color: var(--bad); }
.fb p { margin: 0; }
.fb figure { background: var(--surf); }
.kbd { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.result { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; }
@media (max-width: 560px) { .result { grid-template-columns: 1fr; } }
.review { display: grid; gap: 12px; }
.review .card { display: grid; gap: 6px; }
.review .card p { margin: 0; }
.review .yours { color: var(--bad); font-size: .9rem; } .review .right { color: var(--ok); font-size: .9rem; font-weight: 600; }

/* Auto-évaluation et chrono */
.ae { display: grid; gap: 14px; }
.ae fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin: 0; background: var(--surf); min-width: 0; }
.ae legend { font-weight: 600; padding: 0 6px; }
.ae .opts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.ae label.o { display: inline-flex; gap: 8px; align-items: center; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: .93rem; }
.ae label.o:has(input:checked) { border-color: var(--cyan); background: color-mix(in srgb, var(--cyan) 10%, var(--surf)); }
.ae input[type=radio] { accent-color: var(--cyan); }
.ae .hint { font-size: .85rem; color: var(--muted); margin: 4px 0 0; }
.verdict { display: grid; gap: 10px; }
.vrow { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.vrow p { margin: 0; font-size: .93rem; }
@media (max-width: 560px) { .vrow { grid-template-columns: 1fr; } }
.chrono-q { font-family: var(--f-mono); font-size: 1.25rem; font-weight: 500; }
.chrono-in { display: flex; gap: 10px; flex-wrap: wrap; }
.chrono-in input { font-family: var(--f-mono); font-size: 1.4rem; width: 180px; max-width: 100%; padding: 10px 12px; border: 2px solid var(--line); border-radius: 8px; background: var(--surf); color: var(--fg); }
.chrono-in input:focus { border-color: var(--cyan); outline: none; }
.timer { font-family: var(--f-mono); font-size: 2rem; font-variant-numeric: tabular-nums; }
.confirm { border: 1.5px solid var(--bad); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.sync { font-family: var(--f-mono); font-size: .72rem; }
.foot { font-size: .82rem; color: var(--muted); max-width: 75ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#accueil"><b>Objectif Ligne</b><span>carnet de progression</span></a>
    <nav id="nav"></nav>
    <div class="topbar"><span id="top-pct">0 %</span><span class="bar"><i id="top-bar" style="width:0%"></i></span><span class="sync" id="sync">sauvegarde locale</span></div>
  </div>
</header>
<main id="view" class="view" aria-live="polite"></main>

<script>/*__FIGURES__*/</script>
<script>/*__DATA__*/</script>
<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const PASS = 0.75;

  const STAGES = [
    { id: 'bilan', code: '00', name: 'Bilan & aptitudes', nav: 'Bilan', desc: 'Le métier, la route complète, les tests psychotechniques et l’anglais. Pour savoir où tu mets les pieds avant d’engager de l’argent.',
      facts: [['Durée', '1 à 2 semaines'], ['Coût', 'Visite médicale classe 1 : quelques centaines d’euros'], ['Objectif', 'Décider en connaissance de cause']] },
    { id: 'ulm', code: 'ULM', name: 'Brevet ULM multiaxes', nav: 'ULM', desc: 'Les bases du vol : pourquoi un avion vole, comment on le pilote, la météo et le tour de piste. La porte d’entrée la moins chère.',
      facts: [['Formation', 'Avec instructeur, sans minimum d’heures fixé (souvent 20 à 30 h)'], ['Théorie', 'QCM national'], ['Coût indicatif', 'Quelques milliers d’euros']] },
    { id: 'ppl', code: 'PPL', name: 'Licence PPL(A)', nav: 'PPL', desc: 'La licence de pilote privé avion selon les règles européennes : navigation, météo, réglementation et facteurs humains approfondis.',
      facts: [['Vol', '45 h minimum dont 10 h solo'], ['Théorie', '9 matières, 75 % requis'], ['Médical', 'Classe 2 (classe 1 si tu vises la ligne)'], ['Coût indicatif', '10 000 à 18 000 €']] },
    { id: 'atpl', code: 'ATPL', name: 'ATPL théorique', nav: 'ATPL', desc: 'Les 13 matières de l’examen théorique de pilote de ligne EASA : le gros morceau intellectuel du parcours.',
      facts: [['Examens', '13 matières, 75 % requis dans chacune'], ['Délai', 'Tout réussir en 18 mois'], ['Volume', 'Environ 650 h de cours minimum en modulaire'], ['Coût indicatif', '3 000 à 8 000 € (à distance)']] }
  ];
  const DOMAINS = { regl: 'Réglementation', aero: 'Aérodynamique', tech: 'Connaissance avion', meteo: 'Météorologie', nav: 'Navigation', perf: 'Performances & préparation', fh: 'Facteurs humains', proc: 'Procédures', com: 'Communications', apt: 'Aptitudes' };

  const DATA = window.PARCOURS || {};
  const MODS = {}; const ORDER = [];
  STAGES.forEach(s => { s.mods = (DATA[s.id] && DATA[s.id].modules) || []; s.mods.forEach(m => { m.stage = s.id; MODS[m.id] = m; ORDER.push(m); }); });

  // ---------- Progression : appareil + compte ----------
  const KEY = 'objectif-ligne-v1';
  const blank = () => ({ mods: {}, errs: {}, exams: {}, auto: null, chrono: [], answered: 0, correct: 0, updated: 0 });
  let P = blank();
  try { const raw = localStorage.getItem(KEY); if (raw) P = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  let dbRef = null, saveTimer = null, writing = false, pending = false;

  function save() {
    P.updated = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {}
    clearTimeout(saveTimer); saveTimer = setTimeout(push, 1200);
    refreshTop();
  }
  async function push() {
    if (!dbRef) return;
    if (writing) { pending = true; return; }
    writing = true;
    try { await dbRef.set(JSON.parse(JSON.stringify(P))); setSync('sauvegardé sur ton compte'); }
    catch (e) { setSync('sauvegarde locale'); }
    writing = false;
    if (pending) { pending = false; push(); }
  }
  function setSync(t) { const el = $('#sync'); if (el) el.textContent = t; }
  async function initCloud() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
      if (!user || !db) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/progress');
      const snap = await Promise.race([ref.get(), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 10000))]);
      dbRef = ref;
      if (snap.exists) {
        const remote = snap.data() || {};
        if ((remote.updated || 0) > (P.updated || 0)) {
          P = Object.assign(blank(), JSON.parse(JSON.stringify(remote)));
          try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {}
          route();
        } else if ((P.updated || 0) > (remote.updated || 0)) push();
      } else if (P.updated) push();
      setSync('sauvegardé sur ton compte');
    } catch (e) { /* on reste en sauvegarde locale */ }
  }

  const mp = id => P.mods[id] || (P.mods[id] = { read: false, best: null, attempts: 0 });
  function modProgress(m) {
    const s = P.mods[m.id]; if (!s) return 0;
    const q = s.best == null ? 0 : Math.min(s.best / PASS, 1);
    return (s.read ? 0.25 : 0) + 0.75 * q;
  }
  const modDone = m => { const s = P.mods[m.id]; return !!(s && s.best != null && s.best >= PASS); };
  const stageProgress = s => s.mods.length ? s.mods.reduce((a, m) => a + modProgress(m), 0) / s.mods.length : 0;
  const globalProgress = () => ORDER.length ? ORDER.reduce((a, m) => a + modProgress(m), 0) / ORDER.length : 0;
  function domainScores() {
    const out = {};
    Object.keys(DOMAINS).forEach(d => {
      const ms = ORDER.filter(m => m.domain === d); if (!ms.length) return;
      const tried = ms.filter(m => P.mods[m.id] && P.mods[m.id].best != null);
      out[d] = { total: ms.length, tried: tried.length, score: tried.length ? tried.reduce((a, m) => a + P.mods[m.id].best, 0) / tried.length : null, cover: ms.reduce((a, m) => a + modProgress(m), 0) / ms.length };
    });
    return out;
  }
  const pct = x => Math.round(x * 100) + ' %';
  const errCount = () => Object.keys(P.errs).length;

  function refreshTop() {
    const g = globalProgress();
    $('#top-pct').textContent = pct(g); $('#top-bar').style.width = (g * 100).toFixed(1) + '%';
  }
  function renderNav(active) {
    const items = [['accueil', 'Tableau de bord']].concat(STAGES.map(s => ['etape-' + s.id, s.nav])).concat([['revision', 'Révision' + (errCount() ? ' (' + errCount() + ')' : '')]]);
    $('#nav').innerHTML = items.map(i => `<a href="#${i[0]}" class="${active === i[0] ? 'on' : ''}">${esc(i[1])}</a>`).join('');
  }

  // ---------- Jauge (altimètre de progression) ----------
  function gauge(p) {
    const cx = 105, cy = 105, r = 86; let t = '';
    for (let i = 0; i < 50; i++) { const a = (i * 7.2 - 90) * Math.PI / 180, l = i % 5 ? 6 : 12; t += `<line x1="${(cx + r * Math.cos(a)).toFixed(1)}" y1="${(cy + r * Math.sin(a)).toFixed(1)}" x2="${(cx + (r - l) * Math.cos(a)).toFixed(1)}" y2="${(cy + (r - l) * Math.sin(a)).toFixed(1)}" stroke="#F2F5F8" stroke-width="${i % 5 ? 1.2 : 2}"/>`; }
    for (let i = 0; i < 10; i++) { const a = (i * 36 - 90) * Math.PI / 180; t += `<text x="${(cx + 62 * Math.cos(a)).toFixed(1)}" y="${(cy + 62 * Math.sin(a) + 5).toFixed(1)}" text-anchor="middle" fill="#F2F5F8" font-size="14">${i}</text>`; }
    const ang = p * 360, a = (ang - 90) * Math.PI / 180;
    const arcEnd = [(cx + (r + 8) * Math.cos(a)).toFixed(1), (cy + (r + 8) * Math.sin(a)).toFixed(1)];
    const fl = Math.round(p * 350 / 5) * 5;
    return `<svg class="gauge" viewBox="0 0 210 210" role="img" aria-label="Progression globale ${pct(p)}">
      <circle cx="${cx}" cy="${cy}" r="102" fill="var(--bezel)"/><circle cx="${cx}" cy="${cy}" r="${r + 4}" fill="var(--panel)"/>
      ${p > 0.001 ? `<path d="M${cx},${cy - r - 8} A${r + 8},${r + 8} 0 ${ang > 180 ? 1 : 0} 1 ${arcEnd[0]},${arcEnd[1]}" stroke="#F065C4" stroke-width="5" fill="none" stroke-linecap="round"/>` : ''}
      ${t}
      <rect x="${cx - 44}" y="${cy + 18}" width="88" height="26" rx="4" fill="#000" stroke="#56677C"/>
      <text x="${cx}" y="${cy + 37}" text-anchor="middle" fill="#F065C4" font-size="17" font-weight="600">FL ${String(fl).padStart(3, '0')}</text>
      <line x1="${cx}" y1="${cy}" x2="${(cx + 70 * Math.cos(a)).toFixed(1)}" y2="${(cy + 70 * Math.sin(a)).toFixed(1)}" stroke="#F2F5F8" stroke-width="4" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="6" fill="#F2F5F8"/>
    </svg>`;
  }

  // ---------- Vues ----------
  function viewHome() {
    renderNav('accueil');
    const g = globalProgress();
    const next = ORDER.find(m => !modDone(m));
    const ds = domainScores();
    const totalQ = ORDER.reduce((a, m) => a + m.quiz.length, 0);
    const doneMods = ORDER.filter(modDone).length;
    const rate = P.answered ? P.correct / P.answered : null;
    const nextAct = next ? (P.mods[next.id] && P.mods[next.id].read ? ['quiz-' + next.id, 'Passer le quiz'] : ['cours-' + next.id, 'Ouvrir le cours']) : null;
    const auto = P.auto && P.auto.result;
    const chronoBest = P.chrono.length ? Math.max(...P.chrono.map(c => c.score)) : null;
    return `
      <section class="hero">
        <div>
          <div class="eyebrow">Pierrick · reconversion pilote de ligne</div>
          <h1>Du premier vol au siège de droite</h1>
          <p>Trois étapes de formation, comme si tu passais réellement le brevet ULM, la licence PPL puis l’ATPL théorique. Chaque module : un cours illustré, puis un quiz noté. Un module est validé à partir de 75 %, le seuil des examens européens.</p>
        </div>
        <div style="display:grid;gap:6px;justify-items:center">${gauge(g)}<span class="mono" style="font-size:.8rem;color:var(--muted)">progression globale ${pct(g)}</span></div>
      </section>
      ${next ? `<section class="card next"><div><div class="eyebrow">Prochaine étape · ${esc(STAGES.find(s => s.id === next.stage).name)}</div><h2>${esc(next.title)}</h2><p style="margin:.4em 0 0;color:var(--muted)">${esc(next.intro)}</p></div><a class="btn pri" href="#${nextAct[0]}">${nextAct[1]} →</a></section>`
        : `<section class="card next"><div><div class="eyebrow">Parcours terminé</div><h2>Tous les modules sont validés</h2><p style="margin:.4em 0 0;color:var(--muted)">Passe les examens blancs et révise tes erreurs pour consolider.</p></div><a class="btn pri" href="#revision">Réviser →</a></section>`}
      <section class="grid4">
        ${STAGES.map(s => { const sp = stageProgress(s), d = s.mods.filter(modDone).length, ex = P.exams[s.id];
          return `<a class="card stage" href="#etape-${s.id}"><div class="meta"><span>ÉTAPE</span><span>${d}/${s.mods.length} validés</span></div><div class="code">${s.code}</div><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p><div class="pbar"><i style="width:${(sp * 100).toFixed(1)}%"></i></div><div class="meta"><span>${pct(sp)}</span><span>${ex ? 'examen blanc ' + pct(ex.best) : 'examen blanc à faire'}</span></div></a>`; }).join('')}
      </section>
      <section class="grid2">
        <div class="card"><div class="eyebrow">Compétences du pilote</div><h2 style="margin:.2em 0 .6em">Ton niveau par domaine</h2>
          <div class="skills">${Object.keys(ds).map(d => { const x = ds[d]; return `<div class="skill"><span>${DOMAINS[d]}</span><div class="pbar ${x.score != null && x.score < PASS ? 'cy' : ''}"><i style="width:${((x.score || 0) * 100).toFixed(0)}%"></i></div><span class="v ${x.score == null ? 'na' : ''}">${x.score == null ? 'à évaluer' : pct(x.score)}</span></div>`; }).join('')}</div>
          <p class="legend" style="margin-top:14px"><span>Moyenne de tes meilleurs scores aux quiz de chaque domaine. Magenta : au-dessus de 75 %. Cyan : à retravailler.</span></p>
        </div>
        <div style="display:grid;gap:18px;align-content:start">
          <div class="card"><div class="eyebrow">Mesurer ta capacité</div><h2 style="margin:.2em 0 .4em">Bilan d’aptitude</h2>
            ${auto ? `<p style="margin:0 0 10px">${verdictPill(auto.level)} ${esc(auto.summary)}</p>` : `<p style="margin:0 0 10px;color:var(--muted)">10 questions honnêtes sur ta santé, ton budget, ton temps, ton anglais… pour repérer ce qui peut bloquer.</p>`}
            <div class="btns"><a class="btn" href="#auto-evaluation">${auto ? 'Revoir mon bilan' : 'Faire mon bilan'}</a><a class="btn" href="#chrono">Calcul mental chrono${chronoBest != null ? ' · record ' + chronoBest + '/10' : ''}</a></div>
          </div>
          <div class="card"><div class="eyebrow">Statistiques</div>
            <div class="stats" style="margin-top:8px">
              <div class="stat"><b>${doneMods}/${ORDER.length}</b><span>modules validés</span></div>
              <div class="stat"><b>${P.answered}</b><span>réponses données (${totalQ} questions au total)</span></div>
              <div class="stat"><b>${rate == null ? '–' : pct(rate)}</b><span>taux de bonnes réponses</span></div>
              <div class="stat"><b>${errCount()}</b><span>erreurs à réviser</span></div>
            </div>
            ${errCount() ? '<div class="btns" style="margin-top:12px"><a class="btn" href="#revision">Réviser mes erreurs</a></div>' : ''}
          </div>
        </div>
      </section>
      <section class="card"><div class="eyebrow">La route complète</div><h2 style="margin:.2em 0 .8em">Où tu en es sur le chemin de la ligne</h2>${renderFig('parcours')}</section>
      ${resetBlock()}
      <p class="foot">Ce programme est un outil d’entraînement personnel. Il ne remplace ni une école agréée (ATO), ni les manuels officiels, ni l’avis d’un instructeur ou d’un médecin aéronautique. Les règles évoluent : vérifie toujours les textes en vigueur auprès de l’EASA, de la DGAC et des autorités de Nouvelle-Calédonie.</p>`;
  }

  function resetBlock() {
    return `<section><button class="btn ghost" id="reset-ask" type="button">Remettre ma progression à zéro</button><div class="confirm" id="reset-box" hidden><p style="margin:0">Effacer tous les scores, cours lus, erreurs et le bilan ? Cette action est définitive.</p><div class="btns"><button class="btn" id="reset-no" type="button">Annuler</button><button class="btn pri" id="reset-yes" type="button">Tout effacer</button></div></div></section>`;
  }

  function viewStage(id) {
    const s = STAGES.find(x => x.id === id); if (!s) return viewHome();
    renderNav('etape-' + id);
    const sp = stageProgress(s), ex = P.exams[id];
    const nQ = s.mods.reduce((a, m) => a + m.quiz.length, 0);
    return `
      <div class="crumbs"><a href="#accueil">Tableau de bord</a><span>/</span><span>${esc(s.name)}</span></div>
      <section style="display:grid;gap:14px">
        <div class="eyebrow">Étape ${s.code}</div><h1>${esc(s.name)}</h1>
        <p style="margin:0;max-width:65ch;color:var(--muted)">${esc(s.desc)}</p>
        <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center"><div class="pbar"><i style="width:${(sp * 100).toFixed(1)}%"></i></div><span class="mono">${pct(sp)}</span></div>
        <div class="facts">${s.facts.map(f => `<div><b>${esc(f[0])}</b>${esc(f[1])}</div>`).join('')}</div>
      </section>
      <ol class="mods">${s.mods.map((m, i) => modRow(m, i)).join('')}</ol>
      <section class="card next"><div><div class="eyebrow">Examen blanc</div><h2>${s.mods.length ? Math.min(20, nQ) : 0} questions tirées au hasard dans toute l’étape</h2><p style="margin:.4em 0 0;color:var(--muted)">Conditions d’examen : pas d’explication avant la fin, 75 % pour réussir.${ex ? ' Meilleur score : ' + pct(ex.best) + '.' : ''}</p></div><a class="btn pri" href="#examen-${s.id}">Lancer l’examen →</a></section>`;
  }
  function modRow(m, i) {
    const s = P.mods[m.id], done = modDone(m), prog = !done && modProgress(m) > 0;
    const status = done ? '<span class="pill ok">validé</span>' : s && s.best != null ? '<span class="pill warn">à retenter</span>' : s && s.read ? '<span class="pill cy">cours lu</span>' : '<span class="pill mut">à faire</span>';
    return `<li class="mod ${done ? 'done' : prog ? 'prog' : ''}"><span class="n">${done ? '✓' : i + 1}</span>
      <div><h3>${esc(m.title)}</h3><div class="sub">${status}<span>${DOMAINS[m.domain] || ''}</span><span class="mono">${m.duration} min · ${m.quiz.length} questions</span>${s && s.best != null ? `<span class="mono">meilleur : ${pct(s.best)}</span>` : ''}</div></div>
      <div class="acts"><a class="btn" href="#cours-${m.id}">Cours</a><a class="btn ${s && s.read && !done ? 'pri' : ''}" href="#quiz-${m.id}">Quiz</a></div></li>`;
  }

  function fig(key, cap) {
    if (!key || !window.FIGURES[key]) return '';
    return `<figure>${renderFig(key)}${cap ? `<figcaption>${esc(cap)}</figcaption>` : ''}</figure>`;
  }
  function wrapTables(html) { return String(html).replace(/<table/g, '<div class="tblwrap"><table').replace(/<\/table>/g, '</table></div>'); }

  function viewLesson(id) {
    const m = MODS[id]; if (!m) return viewHome();
    const s = STAGES.find(x => x.id === m.stage);
    renderNav('etape-' + s.id);
    const idx = s.mods.indexOf(m);
    return `
      <div class="crumbs"><a href="#accueil">Tableau de bord</a><span>/</span><a href="#etape-${s.id}">${esc(s.name)}</a><span>/</span><span>Module ${idx + 1}</span></div>
      <article class="lesson">
        <header><div class="eyebrow">${esc(s.code)} · module ${idx + 1} · ${DOMAINS[m.domain] || ''} · ${m.duration} min</div><h1>${esc(m.title)}</h1><p class="intro">${esc(m.intro)}</p></header>
        ${m.sections.map((sec, i) => `<section class="sec"><h2><span class="k">${String(i + 1).padStart(2, '0')}</span>${esc(sec.h)}</h2><div class="prose">${wrapTables(sec.html)}</div>${fig(sec.fig, sec.caption)}${sec.tip ? `<div class="tip"><b>Astuce</b><span>${esc(sec.tip)}</span></div>` : ''}</section>`).join('')}
        <section class="keys"><h3>À retenir</h3><ul>${m.keypoints.map(k => `<li><span>${esc(k)}</span></li>`).join('')}</ul></section>
        ${m.links && m.links.length ? `<section class="links"><div class="eyebrow">Pour aller plus loin (sites officiels et références)</div>${m.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}</section>` : ''}
        <div class="btns"><button class="btn pri" id="read-go" data-id="${m.id}" type="button">J’ai lu ce cours · passer au quiz →</button><a class="btn" href="#etape-${s.id}">Retour à l’étape</a></div>
      </article>`;
  }

  // ---------- Quiz ----------
  let Q = null; // session en cours
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function prepare(item) {
    const order = shuffle(item.q.choices.map((_, i) => i));
    return Object.assign({}, item, { order, picked: null });
  }
  function startQuiz(kind, ref) {
    let items = [], title = '', back = '#accueil';
    if (kind === 'quiz') { const m = MODS[ref]; items = m.quiz.map((q, i) => ({ q, mod: m.id, i })); items = shuffle(items); title = m.title; back = '#etape-' + m.stage; }
    if (kind === 'examen') { const s = STAGES.find(x => x.id === ref); s.mods.forEach(m => m.quiz.forEach((q, i) => items.push({ q, mod: m.id, i }))); items = shuffle(items).slice(0, 20); title = 'Examen blanc · ' + s.name; back = '#etape-' + s.id; }
    if (kind === 'revision') { Object.keys(P.errs).forEach(k => { const [mod, i] = k.split('#'); if (MODS[mod] && MODS[mod].quiz[+i]) items.push({ q: MODS[mod].quiz[+i], mod, i: +i }); }); items = shuffle(items).slice(0, 15); title = 'Révision de mes erreurs'; }
    Q = { kind, ref, title, back, items: items.map(prepare), cur: 0, done: false, exam: kind === 'examen' };
  }
  function viewQuiz() {
    if (!Q.items.length) return `<div class="crumbs"><a href="#accueil">Tableau de bord</a></div><section class="card"><h2>Rien à réviser</h2><p>Aucune erreur enregistrée pour le moment. Les questions ratées dans les quiz apparaîtront ici jusqu’à ce que tu y répondes juste.</p><a class="btn pri" href="#accueil">Retour</a></section>`;
    if (Q.done) return viewResult();
    const it = Q.items[Q.cur], letters = 'ABCD';
    const answered = it.picked != null, good = answered && it.order[it.picked] === it.q.a;
    const showFb = answered && !Q.exam;
    return `
      <div class="crumbs"><a href="#accueil">Tableau de bord</a><span>/</span><a href="${Q.back}">${Q.kind === 'revision' ? 'Révision' : 'Retour à l’étape'}</a></div>
      <section class="quiz">
        <div><div class="eyebrow">${Q.exam ? 'Examen blanc' : Q.kind === 'revision' ? 'Révision' : 'Quiz'}</div><h1 style="font-size:2rem">${esc(Q.title)}</h1></div>
        <div class="qsteps">${Q.items.map((x, i) => `<i class="${i === Q.cur ? 'cur' : x.picked == null ? '' : Q.exam ? 'cur' : x.order[x.picked] === x.q.a ? 'ok' : 'ko'}"></i>`).join('')}</div>
        <div class="qhead"><span>Question ${Q.cur + 1} / ${Q.items.length}</span><span>${esc(MODS[it.mod].title)}</span></div>
        <p class="qtext">${esc(it.q.q)}</p>
        <div class="choices">${it.order.map((orig, k) => {
          let cls = '';
          if (answered && !Q.exam) { if (orig === it.q.a) cls = 'good'; else if (k === it.picked) cls = 'wrong'; }
          if (answered && Q.exam && k === it.picked) cls = 'picked';

    if (t.id === 'q-next') return nextQ();
    if (t.dataset.retry) { e.preventDefault(); Q = null; if (location.hash === t.getAttribute('href')) render(); else location.hash = t.getAttribute('href'); window.scrollTo({ top: 0 }); return; }
    if (t.id === 'read-go') { const m = mp(t.dataset.id); m.read = true; save(); location.hash = '#quiz-' + t.dataset.id; return; }
    if (t.id === 'c-start') return chronoStart();
    if (t.id === 'reset-ask') { $('#reset-box').hidden = false; t.hidden = true; return; }
    if (t.id === 'reset-no') { $('#reset-box').hidden = true; $('#reset-ask').hidden = false; return; }
    if (t.id === 'reset-yes') { P = blank(); save(); render(); return; }
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'c-form') return chronoAnswer($('#c-in').value.trim());
    if (e.target.id === 'ae-form') {
      const fd = new FormData(e.target), ans = { age: fd.get('age'), ans: fd.get('ans') };
      AE.forEach(a => { const v = fd.get(a.id); if (v != null) ans[a.id] = +v; });
      P.auto = { ans, result: computeAuto(ans), at: Date.now() }; save(); render();
      const r = $('#ae-result'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
  document.addEventListener('keydown', e => {
    if (!Q || Q.done || !/^#(quiz|examen|revision)/.test(location.hash)) return;
    if (e.target.matches('input, select, textarea')) return;
    const it = Q.items[Q.cur];
    if (it && it.picked == null && /^[1-4]$/.test(e.key) && +e.key <= it.order.length) { e.preventDefault(); answer(+e.key - 1); }
    else if (it && it.picked != null && e.key === 'Enter' && !e.target.matches('button, a')) { e.preventDefault(); nextQ(); }
  });

  render();
  initCloud();
})();
</script>
